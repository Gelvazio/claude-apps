<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERP — Pedidos de Venda</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .app-layout { display: flex; min-height: calc(100vh - 56px); }
    .main { margin-left: 240px; padding: 28px 32px; flex: 1; }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main { margin-left: 0; padding: 16px; } .sidebar.open { transform: translateX(0); } }
    .sidebar-section { padding: 16px 0 4px; }
    .sidebar-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
    .btn-menu { display: none; background: rgba(255,255,255,.15); border: none; color: #fff; font-size: 20px; width: 36px; height: 36px; border-radius: 6px; cursor: pointer; align-items: center; justify-content: center; }
    @media (max-width: 768px) { .btn-menu { display: flex; } }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 49; }
    .sidebar-overlay.show { display: block; }

    .page-header { margin-bottom: 24px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .page-header h1 { font-size: 20px; font-weight: 700; color: var(--color-text); }
    .page-header p { font-size: 13px; color: var(--color-text-muted); margin-top: 2px; }

    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .search-input { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 13px; font-family: inherit; background: var(--color-surface); color: var(--color-text); outline: none; }
    .search-input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(0,67,132,.12); }
    [data-theme="dark"] .search-input { background: var(--color-surface-2); border-color: var(--color-border); color: var(--color-text); }

    .content-card { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }

    .msg-global { margin-bottom: 14px; display: none; }

    /* Modal footer */
    .modal-foot { padding: 12px 20px; display: flex; gap: 10px; justify-content: flex-end; align-items: center; border-top: 1px solid var(--color-border-faint); background: var(--color-surface); flex-shrink: 0; }
    [data-theme="dark"] .modal-foot { border-top-color: var(--color-border-light); }

    /* Estoque info */
    .estoque-info { font-size: 12px; color: var(--color-text-muted); margin-top: 3px; min-height: 16px; }
    .estoque-info.ok   { color: var(--color-success); }
    .estoque-info.warn { color: var(--color-warning); }
    .estoque-info.err  { color: var(--color-error); }

    /* Alerta de estoque insuficiente no modal */
    .alerta-estoque { background: #fff3cd; border: 1px solid #ffc107; border-radius: var(--radius-md); padding: 8px 12px; font-size: 12px; color: #856404; display: none; margin-top: 8px; }
    .alerta-estoque.show { display: block; }
    [data-theme="dark"] .alerta-estoque { background: #2a2000; border-color: #7a5c00; color: #f0c040; }
  </style>
  <script>
    (function () {
      const t = localStorage.getItem('senai_tema') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="../gamificacao/gamif.js"></script>
</head>
<body>

<!-- ── Header ─────────────────────────────────── -->
<header class="header">
  <button class="btn-menu" id="btnMenu" onclick="toggleSidebar()">☰</button>
  <a class="header-logo" href="../dashboard.html">ERP</a>
  <span class="header-title">Senai</span>
  <span class="header-spacer"></span>
  <span class="role-badge" id="roleBadge"></span>
  <button class="header-btn" id="btnTema" onclick="alternarTema()" style="min-width:96px">🌙 Escuro</button>
  <button class="header-btn" onclick="sair()">🚪 Sair</button>
</header>

<!-- ── Overlay mobile ─────────────────────────── -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- ── Layout ─────────────────────────────────── -->
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Conteúdo -->
  <main class="main">

    <div class="page-header">
      <div>
        <h1>🛍️ Pedidos de Venda</h1>
        <p>Gerencie os pedidos realizados pelos clientes</p>
      </div>
      <button class="btn" onclick="abrirModalNovo()">+ Novo Pedido</button>
    </div>

    <!-- Mensagem global -->
    <div id="msgGlobal" class="crud-msg msg-global"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <input class="search-input" type="text" id="campoBusca" placeholder="Buscar por número ou cliente…" oninput="aplicarFiltros()">
      <select class="search-input" id="filtroStatus" style="flex:0 0 180px" onchange="aplicarFiltros()">
        <option value="">Todos os status</option>
        <option>Rascunho</option>
        <option>Confirmado</option>
        <option>GERAR_NOTA_FISCAL</option>
        <option>EM_ANALISE_CREDITO</option>
        <option>Em Separação</option>
        <option>Em Expedição</option>
        <option>Entregue</option>
        <option>Cancelado</option>
      </select>
    </div>

    <!-- Tabela -->
    <div class="content-card">
      <div class="crud-table-wrap">
        <table class="crud-table">
          <thead>
            <tr>
              <th>Nº</th>
              <th>Cliente</th>
              <th>Produto</th>
              <th>Qtd</th>
              <th>Valor Total</th>
              <th>Status</th>
              <th>Data</th>
              <th>Dt. Prevista</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaBody">
            <tr><td colspan="9" class="crud-vazio">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- ── Modal ──────────────────────────────────── -->
<div class="crud-backdrop" id="modalBackdrop" style="display:none" onclick="backdropClick(event)">
  <div class="crud-modal" style="max-width:700px">
    <div class="crud-modal-head">
      <h3 id="modalTitulo">Novo Pedido de Venda</h3>
      <button class="crud-btn-fechar" onclick="fecharModal()">✕</button>
    </div>
    <div style="overflow-y:auto; flex:1;">
      <div class="crud-form-area">
        <div class="crud-form">

          <div class="crud-field" style="flex:0 0 140px">
            <label class="crud-label">Nº do Pedido</label>
            <input class="crud-input" id="fNumero" readonly style="background:var(--color-surface-2);color:var(--color-text-muted)">
          </div>

          <div class="crud-field" style="flex:1; min-width:200px">
            <label class="crud-label">Cliente <span style="color:var(--color-error)">*</span></label>
            <select class="crud-input" id="fCliente"></select>
          </div>

        </div>
        <div class="crud-form">

          <div class="crud-field" style="flex:1; min-width:200px">
            <label class="crud-label">Produto <span style="color:var(--color-error)">*</span></label>
            <select class="crud-input" id="fProduto" onchange="onProdutoChange()"></select>
            <div class="estoque-info" id="estoqueInfo"></div>
          </div>

          <div class="crud-field" style="flex:0 0 120px">
            <label class="crud-label">Quantidade <span style="color:var(--color-error)">*</span></label>
            <input class="crud-input" type="number" id="fQuantidade" min="0.001" step="any" placeholder="0" oninput="calcTotal()">
          </div>

          <div class="crud-field" style="flex:0 0 150px">
            <label class="crud-label">Preço Unitário (R$)</label>
            <input class="crud-input" type="number" id="fPrecoUnitario" min="0" step="0.01" placeholder="0,00" oninput="calcTotal()">
          </div>

          <div class="crud-field" style="flex:0 0 150px">
            <label class="crud-label">Valor Total (R$)</label>
            <input class="crud-input" id="fValorTotal" readonly style="background:var(--color-surface-2);color:var(--color-text-muted)">
          </div>

        </div>
        <div class="crud-form">

          <div class="crud-field" style="flex:0 0 180px">
            <label class="crud-label">💳 Forma de Pagamento</label>
            <select class="crud-input" id="fFormaPagamento" onchange="onFormaPagamentoChange()">
              <option value="À Vista">💵 À Vista</option>
              <option value="Crediário">📋 Crediário</option>
            </select>
          </div>

          <div class="crud-field" style="flex:0 0 180px">
            <label class="crud-label">Status</label>
            <select class="crud-input" id="fStatus">
              <option>Rascunho</option>
              <option>Confirmado</option>
              <option>GERAR_NOTA_FISCAL</option>
              <option>EM_ANALISE_CREDITO</option>
              <option>Em Separação</option>
              <option>Em Expedição</option>
              <option>Entregue</option>
              <option>Cancelado</option>
              <option>Aguardando Análise Financeira</option>
              <option>Limite Insuficiente</option>
            </select>
          </div>

          <div class="crud-field" style="flex:0 0 150px">
            <label class="crud-label">Data</label>
            <input class="crud-input" type="date" id="fData">
          </div>

          <div class="crud-field" style="flex:0 0 150px">
            <label class="crud-label">Data Prevista</label>
            <input class="crud-input" type="date" id="fDataPrevista">
          </div>

        </div>
        <div class="crud-form">
          <div class="crud-field">
            <label class="crud-label">Observações</label>
            <textarea class="crud-input" id="fObs" rows="3" style="resize:vertical"></textarea>
          </div>
        </div>

        <!-- Alerta de crédito insuficiente -->
        <div id="alertaCredito" style="display:none;background:linear-gradient(135deg,#fff3e0,#fce8e6);border:1px solid #ffb74d;border-radius:10px;padding:14px 18px;margin:0 20px 8px;font-size:13px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span style="font-size:18px">⚠️</span>
            <strong style="color:#bf360c">Análise de Crédito Necessária</strong>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px" id="creditoCards"></div>
          <div id="creditoMensagem" style="font-size:12px;color:#6d4c41;line-height:1.5"></div>
        </div>

        <!-- Alerta estoque insuficiente -->
        <div class="alerta-estoque" id="alertaEstoque">⚠️ <span id="alertaEstoqueTexto"></span></div>
      </div>
    </div>
    <div class="modal-foot">
      <div id="msgModal" class="crud-msg" style="flex:1;display:none"></div>
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" onclick="salvar()">Confirmar</button>
    </div>
  </div>
</div>

<script src="../menu.js"></script>
<script src="../SUPABASE.js"></script>
<script>
  // ── Sessão ──────────────────────────────────────
  sbVerificarSessao('../index.html');
  sbExigirPermissao('vendas', '../dashboard.html');

  // ── Header ─────────────────────────────────────
  document.getElementById('roleBadge').textContent = sbPerfil() || '';

  (function () {
    const t = localStorage.getItem('senai_tema') || 'light';
    const btn = document.getElementById('btnTema');
    if (btn) btn.textContent = t === 'dark' ? '☀️ Claro' : '🌙 Escuro';
  })();

  function alternarTema() {
    const novo = sbToggleTema();
    const btn = document.getElementById('btnTema');
    if (btn) btn.textContent = novo === 'dark' ? '☀️ Claro' : '🌙 Escuro';
  }

  function sair() { sbLogout('../index.html'); }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
  }

  // ── Estado ─────────────────────────────────────
  let registros = [];
  let editId    = null;
  let produtos  = [];

  // ── Carregar dados ─────────────────────────────
  async function carregarDados() {
    try {
      const rows = await sbListar(
        'vendas_pedidos',
        'select=*,clientes(nome),produtos(nome,estoque_atual,unidade)&order=created_at.desc'
      );
      registros = rows;
      renderTabela(rows);
    } catch (e) {
      document.getElementById('tabelaBody').innerHTML =
        `<tr><td colspan="9" class="crud-vazio">Erro ao carregar dados: ${e.message}</td></tr>`;
    }
  }

  // ── Renderizar tabela ───────────────────────────
  function statusBadge(s) {
    const m = {
      'Rascunho': 'badge-cinza', 'Confirmado': 'badge-azul',
      'GERAR_NOTA_FISCAL': 'badge-azul', 'EM_ANALISE_CREDITO': 'badge-laranja',
      'Em Separação': 'badge-laranja', 'Em Expedição': 'badge-laranja',
      'Entregue': 'badge-verde', 'Cancelado': 'badge-vermelho'
    };
    return `<span class="badge ${m[s] || 'badge-cinza'}">${s}</span>`;
  }

  function renderTabela(arr) {
    const tbody = document.getElementById('tabelaBody');
    if (!arr.length) {
      tbody.innerHTML = '<tr><td colspan="9" class="crud-vazio">Nenhum pedido de venda encontrado.</td></tr>';
      return;
    }
    tbody.innerHTML = arr.map(r => `
      <tr>
        <td style="font-family:monospace;font-size:12px">${r.numero}</td>
        <td>${r.clientes?.nome ?? '—'}</td>
        <td>${r.produtos?.nome ?? '—'}</td>
        <td>${Number(r.quantidade).toLocaleString('pt-BR')} ${r.produtos?.unidade ?? ''}</td>
        <td>${sbMoeda(r.valor_total)}</td>
        <td>${statusBadge(r.status)}</td>
        <td>${sbData(r.data)}</td>
        <td>${sbData(r.data_prevista)}</td>
        <td class="crud-acts">
          <button class="btn-ed" onclick="abrirModalEditar('${r.id}')">✏️</button>
          <button class="btn-del" onclick="confirmarExcluir('${r.id}')">🗑️</button>
        </td>
      </tr>
    `).join('');
  }

  // ── Filtros ─────────────────────────────────────
  function aplicarFiltros() {
    const busca  = document.getElementById('campoBusca').value.toLowerCase();
    const status = document.getElementById('filtroStatus').value;
    const filtrado = registros.filter(r => {
      const textoOk  = !busca  || r.numero.toLowerCase().includes(busca) || (r.clientes?.nome ?? '').toLowerCase().includes(busca);
      const statusOk = !status || r.status === status;
      return textoOk && statusOk;
    });
    renderTabela(filtrado);
  }

  // ── Abrir modal (novo) ──────────────────────────
  async function abrirModalNovo() {
    editId = null;
    document.getElementById('modalTitulo').textContent = 'Novo Pedido de Venda';
    resetForm();
    document.getElementById('fData').value = new Date().toISOString().split('T')[0];
    document.getElementById('fNumero').value = await Numerar.pedidoVenda();
    await popularSelects();
    document.getElementById('modalBackdrop').style.display = 'flex';
  }

  // ── Abrir modal (editar) ────────────────────────
  async function abrirModalEditar(id) {
    editId = id;
    document.getElementById('modalTitulo').textContent = 'Editar Pedido de Venda';
    resetForm();
    const r = await sbBuscar('vendas_pedidos', id);
    await popularSelects();
    document.getElementById('fNumero').value       = r.numero;
    document.getElementById('fCliente').value      = r.cliente_id || '';
    document.getElementById('fProduto').value      = r.produto_id || '';
    document.getElementById('fQuantidade').value   = r.quantidade || '';
    document.getElementById('fPrecoUnitario').value = r.preco_unitario || '';
    document.getElementById('fValorTotal').value   = sbMoeda(r.valor_total);
    document.getElementById('fStatus').value          = r.status || 'Rascunho';
    document.getElementById('fFormaPagamento').value   = r.forma_pagamento || 'À Vista';
    document.getElementById('fData').value             = r.data || '';
    document.getElementById('fDataPrevista').value     = r.data_prevista || '';
    document.getElementById('fObs').value              = r.observacoes || '';
    await onProdutoChange(false);
    document.getElementById('modalBackdrop').style.display = 'flex';
  }

  function resetForm() {
    ['fNumero','fCliente','fProduto','fQuantidade','fPrecoUnitario','fValorTotal','fData','fDataPrevista','fObs'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    document.getElementById('fStatus').value        = 'Rascunho';
    document.getElementById('fFormaPagamento').value = 'À Vista';
    document.getElementById('alertaCredito').style.display = 'none';
    document.getElementById('estoqueInfo').textContent = '';
    document.getElementById('alertaEstoque').classList.remove('show');
    document.getElementById('msgModal').style.display = 'none';
  }

  // ── Forma de Pagamento ─────────────────────────
  async function onFormaPagamentoChange() {
    const forma = document.getElementById('fFormaPagamento').value;
    const alertaEl = document.getElementById('alertaCredito');
    if (forma !== 'Crediário') { alertaEl.style.display = 'none'; return; }
    await verificarCredito();
  }

  async function verificarCredito() {
    const clienteId = document.getElementById('fCliente').value;
    const valorStr  = document.getElementById('fValorTotal').value;
    const valorPedido = parseFloat(valorStr.replace(/[^\d,]/g, '').replace(',', '.')) || 0;
    const alertaEl = document.getElementById('alertaCredito');

    if (!clienteId) { alertaEl.style.display = 'none'; return; }

    try {
      const [clientes, parcelas] = await Promise.all([
        sbListar('clientes', `id=eq.${clienteId}&select=nome,limite_credito`),
        sbListar('fin_parcelas', `cliente_id=eq.${clienteId}&status=in.(A Vencer,Vencida)&select=valor`)
      ]);
      const limiteTotal    = parseFloat(clientes[0]?.limite_credito) || 0;
      const limiteUtilizado = parcelas.reduce((s, p) => s + (parseFloat(p.valor) || 0), 0);
      const limiteDisp     = Math.max(0, limiteTotal - limiteUtilizado);
      const temCredito     = valorPedido <= limiteDisp;
      const fmt = v => 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2 });

      document.getElementById('creditoCards').innerHTML = `
        <div style="text-align:center;background:#fff;border-radius:8px;padding:10px 6px;border:1px solid #bbdefb">
          <div style="font-size:10px;color:#5c6bc0;font-weight:700">🏦 TOTAL</div>
          <div style="font-size:14px;font-weight:800;color:#1565c0">${fmt(limiteTotal)}</div>
        </div>
        <div style="text-align:center;background:#fff;border-radius:8px;padding:10px 6px;border:1px solid #ffccbc">
          <div style="font-size:10px;color:#bf360c;font-weight:700">📤 UTILIZADO</div>
          <div style="font-size:14px;font-weight:800;color:#d84315">${fmt(limiteUtilizado)}</div>
        </div>
        <div style="text-align:center;background:#fff;border-radius:8px;padding:10px 6px;border:1px solid ${temCredito ? '#c8e6c9' : '#ffcdd2'}">
          <div style="font-size:10px;color:${temCredito ? '#2e7d32' : '#c62828'};font-weight:700">✅ DISPONÍVEL</div>
          <div style="font-size:14px;font-weight:800;color:${temCredito ? '#2e7d32' : '#c62828'}">${fmt(limiteDisp)}</div>
        </div>
      `;
      document.getElementById('creditoMensagem').innerHTML = temCredito
        ? `<span style="color:#2e7d32;font-weight:600">✅ Crédito disponível para este pedido (${fmt(valorPedido)}).</span> A Nota Fiscal poderá ser gerada normalmente.`
        : `<span style="color:#c62828;font-weight:600">⛔ Crédito insuficiente.</span> O pedido de ${fmt(valorPedido)} excede o limite disponível de ${fmt(limiteDisp)}. Ele será enviado para <strong>fila de análise financeira</strong> e só será liberado após aprovação do Financeiro.`;
      alertaEl.style.display = 'block';
    } catch (e) {
      alertaEl.style.display = 'none';
    }
  }

  // ── Popular selects ─────────────────────────────
  async function popularSelects() {
    await Promise.all([
      sbPopularSelect('fCliente', 'clientes', 'ativo=eq.true&select=id,nome&order=nome.asc', 'id', 'nome', 'Selecione o cliente'),
      carregarProdutos()
    ]);
  }

  async function carregarProdutos() {
    const sel = document.getElementById('fProduto');
    sel.innerHTML = '<option value="">— Selecione o produto —</option>';
    try {
      produtos = await sbListar('produtos', 'ativo=eq.true&select=id,nome,preco_venda,estoque_atual,unidade&order=nome.asc');
      produtos.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = `${p.nome}`;
        sel.appendChild(opt);
      });
    } catch (e) {
      console.error('[carregarProdutos]', e);
    }
  }

  // ── Ao selecionar produto ───────────────────────
  async function onProdutoChange(autoFillPrice = true) {
    const prodId = document.getElementById('fProduto').value;
    const info   = document.getElementById('estoqueInfo');
    const alertaEl = document.getElementById('alertaEstoque');
    alertaEl.classList.remove('show');
    if (!prodId) { info.textContent = ''; info.className = 'estoque-info'; return; }

    const prod = produtos.find(p => p.id === prodId);
    if (!prod) return;

    if (autoFillPrice) {
      document.getElementById('fPrecoUnitario').value = prod.preco_venda || '';
      calcTotal();
    }

    const estAtual = Number(prod.estoque_atual);
    if (estAtual <= 0) {
      info.textContent = `Estoque: 0 ${prod.unidade ?? ''} (sem estoque)`;
      info.className   = 'estoque-info err';
    } else {
      info.textContent = `Estoque disponível: ${estAtual.toLocaleString('pt-BR')} ${prod.unidade ?? ''}`;
      info.className   = 'estoque-info ok';
    }
  }

  // ── Calcular total ──────────────────────────────
  function calcTotal() {
    const qtd   = parseFloat(document.getElementById('fQuantidade').value)   || 0;
    const preco = parseFloat(document.getElementById('fPrecoUnitario').value) || 0;
    document.getElementById('fValorTotal').value = sbMoeda(qtd * preco);
    const forma = document.getElementById('fFormaPagamento').value;
    if (forma === 'Crediário') verificarCredito();
  }

  // ── Salvar ─────────────────────────────────────
  async function salvar() {
    const cliente_id     = document.getElementById('fCliente').value;
    const produto_id     = document.getElementById('fProduto').value;
    const quantidade     = parseFloat(document.getElementById('fQuantidade').value);
    const preco_unitario = parseFloat(document.getElementById('fPrecoUnitario').value) || null;
    const forma_pagamento = document.getElementById('fFormaPagamento').value;
    let   status         = document.getElementById('fStatus').value;
    const data           = document.getElementById('fData').value || null;
    const data_prevista  = document.getElementById('fDataPrevista').value || null;
    const observacoes    = document.getElementById('fObs').value.trim() || null;
    const numero         = document.getElementById('fNumero').value;

    if (!cliente_id) { mostrarMsgModal('Selecione o cliente.', 'err'); return; }
    if (!produto_id) { mostrarMsgModal('Selecione o produto.', 'err'); return; }
    if (!quantidade || quantidade <= 0) { mostrarMsgModal('Informe a quantidade.', 'err'); return; }

    const valorTotal = (preco_unitario || 0) * quantidade;

    const solicitouGerarNota = status === 'GERAR_NOTA_FISCAL';

    // ── Lógica de Crediário antes da Nota Fiscal ─
    if (solicitouGerarNota && forma_pagamento === 'Crediário') {
      const [clientes, parcelas] = await Promise.all([
        sbListar('clientes', `id=eq.${cliente_id}&select=limite_credito`),
        sbListar('fin_parcelas', `cliente_id=eq.${cliente_id}&status=in.(A Vencer,Vencida)&select=valor`)
      ]);
      const limiteTotal    = parseFloat(clientes[0]?.limite_credito) || 0;
      const limiteUtilizado = parcelas.reduce((s, p) => s + (parseFloat(p.valor) || 0), 0);
      const limiteDisp     = Math.max(0, limiteTotal - limiteUtilizado);

      if (valorTotal > limiteDisp) {
        status = 'EM_ANALISE_CREDITO';
      }
    }

    // Verificar estoque ao confirmar
    if (status === 'Confirmado') {
      const check = await sbVerificarEstoque(produto_id, quantidade);
      if (!check.ok) {
        document.getElementById('alertaEstoqueTexto').textContent =
          `Estoque insuficiente! Disponível: ${check.atual.toLocaleString('pt-BR')} unidades. O pedido será salvo mesmo assim.`;
        document.getElementById('alertaEstoque').classList.add('show');
      }
    }

    const dados = { cliente_id, produto_id, quantidade, preco_unitario, forma_pagamento, status, data, data_prevista, observacoes };
    if (!editId) dados.numero = numero;

    try {
      let pedidoId = editId;
      if (editId) {
        await sbAtualizar('vendas_pedidos', editId, dados);
      } else {
        const novoPedido = await sbInserir('vendas_pedidos', dados);
        pedidoId = novoPedido?.id;
        if (window.gamif) await gamif.registrarEvento('pedido_venda_criado');
      }

      const deveGerarNota = status === 'GERAR_NOTA_FISCAL';
      let numeroNotaFiscal = null;
      if (deveGerarNota && pedidoId) {
        numeroNotaFiscal = await gerarNotaFiscalAutomatica(pedidoId, { ...dados, numero });
      }

      fecharModal();
      const msgFin = status === 'EM_ANALISE_CREDITO'
        ? '⚠️ Crédito insuficiente — pedido enviado para a fila de análise de crédito.'
        : (numeroNotaFiscal
          ? `Nota Fiscal <strong>${numeroNotaFiscal}</strong> criada em rascunho. Abrindo a Nota Fiscal...`
          : (editId ? 'Pedido atualizado com sucesso!' : 'Pedido criado com sucesso!'));
      sbMensagem('msgGlobal', msgFin, status === 'EM_ANALISE_CREDITO' ? 'warn' : 'ok');
      document.getElementById('msgGlobal').style.display = 'block';

      if (status === 'EM_ANALISE_CREDITO') {
        window.location.href = '../financeiro/analisecredito.html';
        return;
      }
      if (numeroNotaFiscal) {
        window.location.href = 'nota-fiscal-venda.html';
        return;
      }

      await carregarDados();
    } catch (e) {
      mostrarMsgModal('Erro ao salvar: ' + e.message, 'err');
    }
  }

  async function gerarNotaFiscalAutomatica(pedidoId, pedido) {
    const existentes = await sbListar(
      'vendas_notas_fiscais',
      `pedido_id=eq.${encodeURIComponent(pedidoId)}&select=id,numero_nf&limit=1`
    );
    if (existentes.length) return existentes[0].numero_nf;

    const numero_nf = await sbProximoNumero('vendas_notas_fiscais', 'numero_nf', 'NF');
    await sbInserir('vendas_notas_fiscais', {
      numero_nf,
      serie: '001',
      data_emissao: new Date().toISOString().split('T')[0],
      natureza_operacao: 'Venda de Mercadoria',
      cliente_id: pedido.cliente_id,
      pedido_id: pedidoId,
      produto_id: pedido.produto_id,
      quantidade: pedido.quantidade,
      valor_unitario: pedido.preco_unitario,
      valor_produtos: (pedido.preco_unitario || 0) * pedido.quantidade,
      valor_total: (pedido.preco_unitario || 0) * pedido.quantidade,
      status: 'Rascunho',
      informacoes_complementares: `Gerada automaticamente pela confirmação do Pedido de Venda ${pedido.numero}`
    });
    return numero_nf;
  }

  function mostrarMsgModal(texto, tipo) {
    const el = document.getElementById('msgModal');
    el.textContent = texto;
    el.className   = 'crud-msg ' + tipo;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  // ── Excluir ─────────────────────────────────────
  async function confirmarExcluir(id) {
    if (!confirm('Tem certeza que deseja excluir este pedido? Esta ação não pode ser desfeita.')) return;
    try {
      await sbExcluir('vendas_pedidos', id);
      sbMensagem('msgGlobal', 'Pedido excluído com sucesso!', 'ok');
      document.getElementById('msgGlobal').style.display = 'block';
      await carregarDados();
    } catch (e) {
      sbMensagem('msgGlobal', 'Erro ao excluir: ' + e.message, 'err');
      document.getElementById('msgGlobal').style.display = 'block';
    }
  }

  // ── Fechar modal ────────────────────────────────
  function fecharModal() {
    document.getElementById('modalBackdrop').style.display = 'none';
  }

  function backdropClick(e) {
    if (e.target === document.getElementById('modalBackdrop')) fecharModal();
  }

  // ── Iniciar ─────────────────────────────────────
  carregarDados();
</script>
<script>
  (function () {
    if (localStorage.getItem('erp_role') === 'Administrador') {
      var el = document.getElementById('linkAdmin');
      if (el) el.style.display = 'flex';
    }
  })();
</script>
