<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERP — NF de Venda</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .app-layout { display: flex; min-height: calc(100vh - 56px); }
    .main { margin-left: 240px; padding: 28px 32px; flex: 1; }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main { margin-left: 0; padding: 16px; } .sidebar.open { transform: translateX(0); } }
    .sidebar-section { padding: 16px 0 4px; }
    .sidebar-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
    .btn-menu { display: none; background: rgba(255,255,255,.15); border: none; color: #fff; font-size: 20px; width: 36px; height: 36px; border-radius: 6px; cursor: pointer; align-items: center; justify-content: center; }
    @media (max-width: 768px) { .btn-menu { display: flex; } }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 49; }
    .sidebar-overlay.show { display: block; }

    .page-header { margin-bottom: 24px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .page-header h1 { font-size: 20px; font-weight: 700; color: var(--color-text); }
    .page-header p { font-size: 13px; color: var(--color-text-muted); margin-top: 2px; }

    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .search-input { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 13px; font-family: inherit; background: var(--color-surface); color: var(--color-text); outline: none; }
    .search-input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(0,67,132,.12); }
    [data-theme="dark"] .search-input { background: var(--color-surface-2); border-color: var(--color-border); color: var(--color-text); }

    .content-card { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
    .msg-global { margin-bottom: 14px; display: none; }
    .modal-foot { padding: 12px 20px; display: flex; gap: 10px; justify-content: flex-end; align-items: center; border-top: 1px solid var(--color-border-faint); background: var(--color-surface); flex-shrink: 0; }
    [data-theme="dark"] .modal-foot { border-top-color: var(--color-border-light); }

    .section-title { font-size: 11px; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .5px; padding: 10px 0 6px; border-top: 1px solid var(--color-border-faint); margin-top: 10px; }
    .section-title:first-child { border-top: none; margin-top: 0; padding-top: 0; }
  </style>
  <script>
    (function () {
      const t = localStorage.getItem('senai_tema') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

<header class="header">
  <button class="btn-menu" id="btnMenu" onclick="toggleSidebar()">☰</button>
  <a class="header-logo" href="../dashboard.html">ERP</a>
  <span class="header-title">Senai</span>
  <span class="header-spacer"></span>
  <span class="role-badge" id="roleBadge"></span>
  <button class="header-btn" id="btnTema" onclick="alternarTema()" style="min-width:96px">🌙 Escuro</button>
  <button class="header-btn" onclick="sair()">🚪 Sair</button>
</header>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>📄 NF de Venda</h1>
        <p>Notas fiscais emitidas para clientes</p>
      </div>
      <button class="btn" onclick="abrirModalNovo()">+ Nova NF de Venda</button>
    </div>

    <div id="msgGlobal" class="crud-msg msg-global"></div>

    <div class="toolbar">
      <input class="search-input" type="text" id="campoBusca" placeholder="Buscar por número da NF ou cliente…" oninput="aplicarFiltros()">
      <select class="search-input" id="filtroStatus" style="flex:0 0 180px" onchange="aplicarFiltros()">
        <option value="">Todos os status</option>
        <option>Rascunho</option>
        <option>Emitida</option>
        <option>Cancelada</option>
      </select>
    </div>

    <div class="content-card">
      <div class="crud-table-wrap">
        <table class="crud-table">
          <thead>
            <tr>
              <th>Nº NF</th>
              <th>Série</th>
              <th>Cliente</th>
              <th>Pedido</th>
              <th>Valor Total</th>
              <th>Status</th>
              <th>Dt. Emissão</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaBody">
            <tr><td colspan="8" class="crud-vazio">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="crud-backdrop" id="modalBackdrop" style="display:none" onclick="backdropClick(event)">
  <div class="crud-modal" style="max-width:800px">
    <div class="crud-modal-head">
      <h3 id="modalTitulo">Nova NF de Venda</h3>
      <button class="crud-btn-fechar" onclick="fecharModal()">✕</button>
    </div>
    <div style="overflow-y:auto; flex:1;">
      <div class="crud-form-area">

        <div class="section-title">Identificação</div>
        <div class="crud-form">
          <div class="crud-field" style="flex:0 0 160px">
            <label class="crud-label">Nº da Nota Fiscal <span style="color:var(--color-error)">*</span></label>
            <input class="crud-input" id="fNroNF" placeholder="000000">
          </div>
          <div class="crud-field" style="flex:0 0 100px">
            <label class="crud-label">Série</label>
            <input class="crud-input" id="fSerie" placeholder="001">
          </div>
          <div class="crud-field" style="flex:0 0 150px">
            <label class="crud-label">Data de Emissão <span style="color:var(--color-error)">*</span></label>
            <input class="crud-input" type="date" id="fDataEmissao">
          </div>
          <div class="crud-field" style="flex:0 0 160px">
            <label class="crud-label">Status</label>
            <select class="crud-input" id="fStatus">
              <option>Rascunho</option>
              <option>Emitida</option>
              <option>Cancelada</option>
            </select>
          </div>
        </div>

        <div class="section-title">Partes Envolvidas</div>
        <div class="crud-form">
          <div class="crud-field" style="flex:1; min-width:200px">
            <label class="crud-label">Natureza da Operação</label>
            <input class="crud-input" id="fNatureza" placeholder="Venda de Mercadoria">
          </div>
          <div class="crud-field" style="flex:1; min-width:200px">
            <label class="crud-label">Empresa Emitente <span style="color:var(--color-error)">*</span></label>
            <input class="crud-input" id="fEmitente" placeholder="Nome da empresa emitente">
          </div>
        </div>
        <div class="crud-form">
          <div class="crud-field" style="flex:1; min-width:200px">
            <label class="crud-label">Cliente Destinatário <span style="color:var(--color-error)">*</span></label>
            <select class="crud-input" id="fCliente"></select>
          </div>
          <div class="crud-field" style="flex:1; min-width:200px">
            <label class="crud-label">Pedido de Venda</label>
            <select class="crud-input" id="fPedido"></select>
          </div>
        </div>

        <div class="section-title">Produtos</div>
        <div class="crud-form">
          <div class="crud-field" style="flex:1; min-width:200px">
            <label class="crud-label">Produto <span style="color:var(--color-error)">*</span></label>
            <select class="crud-input" id="fProduto"></select>
          </div>
          <div class="crud-field" style="flex:0 0 110px">
            <label class="crud-label">Quantidade</label>
            <input class="crud-input" type="number" id="fQtd" min="0" step="any" placeholder="0" oninput="calcTotais()">
          </div>
          <div class="crud-field" style="flex:0 0 130px">
            <label class="crud-label">Valor Unitário (R$)</label>
            <input class="crud-input" type="number" id="fValUnit" min="0" step="0.01" placeholder="0,00" oninput="calcTotais()">
          </div>
          <div class="crud-field" style="flex:0 0 150px">
            <label class="crud-label">Valor dos Produtos (R$)</label>
            <input class="crud-input" id="fValProd" readonly style="background:var(--color-surface-2);color:var(--color-text-muted)">
          </div>
        </div>

        <div class="section-title">Impostos e Frete</div>
        <div class="crud-form">
          <div class="crud-field" style="flex:0 0 130px">
            <label class="crud-label">Desconto (R$)</label>
            <input class="crud-input" type="number" id="fDesconto" min="0" step="0.01" placeholder="0,00" oninput="calcTotais()">
          </div>
          <div class="crud-field" style="flex:0 0 130px">
            <label class="crud-label">Frete (R$)</label>
            <input class="crud-input" type="number" id="fFrete" min="0" step="0.01" placeholder="0,00" oninput="calcTotais()">
          </div>
          <div class="crud-field" style="flex:0 0 130px">
            <label class="crud-label">Base ICMS (R$)</label>
            <input class="crud-input" type="number" id="fBaseICMS" min="0" step="0.01" placeholder="0,00" oninput="calcTotais()">
          </div>
          <div class="crud-field" style="flex:0 0 130px">
            <label class="crud-label">Valor ICMS (R$)</label>
            <input class="crud-input" type="number" id="fValICMS" min="0" step="0.01" placeholder="0,00" oninput="calcTotais()">
          </div>
          <div class="crud-field" style="flex:0 0 130px">
            <label class="crud-label">Valor IPI (R$)</label>
            <input class="crud-input" type="number" id="fValIPI" min="0" step="0.01" placeholder="0,00" oninput="calcTotais()">
          </div>
          <div class="crud-field" style="flex:0 0 160px">
            <label class="crud-label">Valor Total (R$)</label>
            <input class="crud-input" id="fValTotal" readonly style="background:var(--color-surface-2);color:var(--color-text-muted);font-weight:700">
          </div>
        </div>

        <div class="section-title">Transporte</div>
        <div class="crud-form">
          <div class="crud-field" style="flex:1; min-width:180px">
            <label class="crud-label">Transportadora</label>
            <select class="crud-input" id="fTransportadora"></select>
          </div>
          <div class="crud-field" style="flex:0 0 200px">
            <label class="crud-label">Frete por Conta</label>
            <select class="crud-input" id="fFreteConta">
              <option value="">— Selecione —</option>
              <option>Emitente (CIF)</option>
              <option>Destinatário (FOB)</option>
              <option>Sem Frete</option>
            </select>
          </div>
          <div class="crud-field" style="flex:0 0 120px">
            <label class="crud-label">Qtd. Volumes</label>
            <input class="crud-input" type="number" id="fQtdVol" min="0" step="1" placeholder="0">
          </div>
          <div class="crud-field" style="flex:0 0 120px">
            <label class="crud-label">Peso Líq. (kg)</label>
            <input class="crud-input" type="number" id="fPesoLiq" min="0" step="0.001" placeholder="0,000">
          </div>
          <div class="crud-field" style="flex:0 0 120px">
            <label class="crud-label">Peso Bruto (kg)</label>
            <input class="crud-input" type="number" id="fPesoBruto" min="0" step="0.001" placeholder="0,000">
          </div>
        </div>

        <div class="section-title">Informações Complementares</div>
        <div class="crud-form">
          <div class="crud-field">
            <label class="crud-label">Informações Complementares</label>
            <textarea class="crud-input" id="fInfoComp" rows="3" style="resize:vertical"></textarea>
          </div>
        </div>

      </div>
    </div>
    <div class="modal-foot">
      <div id="msgModal" class="crud-msg" style="flex:1;display:none"></div>
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" onclick="salvar()">Confirmar</button>
    </div>
  </div>
</div>

<script src="../menu.js"></script>
<script src="../SUPABASE.js"></script>
<script>
  sbVerificarSessao('../index.html');
  sbExigirPermissao('vendas', '../dashboard.html');

  document.getElementById('roleBadge').textContent = sbPerfil() || '';

  (function () {
    const t = localStorage.getItem('senai_tema') || 'light';
    const btn = document.getElementById('btnTema');
    if (btn) btn.textContent = t === 'dark' ? '☀️ Claro' : '🌙 Escuro';
  })();

  function alternarTema() {
    const novo = sbToggleTema();
    const btn = document.getElementById('btnTema');
    if (btn) btn.textContent = novo === 'dark' ? '☀️ Claro' : '🌙 Escuro';
  }

  function sair() { sbLogout('../index.html'); }
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
  }

  let registros = [];
  let editId    = null;

  async function carregarDados() {
    try {
      const rows = await sbListar(
        'vendas_notas_fiscais',
        'select=*,clientes(nome),vendas_pedidos(numero)&order=created_at.desc'
      );
      registros = rows;
      renderTabela(rows);
    } catch (e) {
      document.getElementById('tabelaBody').innerHTML =
        `<tr><td colspan="8" class="crud-vazio">Erro ao carregar: ${e.message}</td></tr>`;
    }
  }

  function statusBadge(s) {
    const m = { 'Rascunho': 'badge-cinza', 'Emitida': 'badge-verde', 'Cancelada': 'badge-vermelho' };
    return `<span class="badge ${m[s] || 'badge-cinza'}">${s}</span>`;
  }

  function renderTabela(arr) {
    const tbody = document.getElementById('tabelaBody');
    if (!arr.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="crud-vazio">Nenhuma nota fiscal encontrada.</td></tr>';
      return;
    }
    tbody.innerHTML = arr.map(r => `
      <tr>
        <td style="font-family:monospace;font-size:12px">${r.numero_nf}</td>
        <td>${r.serie ?? '—'}</td>
        <td>${r.clientes?.nome ?? '—'}</td>
        <td style="font-family:monospace;font-size:12px">${r.vendas_pedidos?.numero ?? '—'}</td>
        <td>${sbMoeda(r.valor_total)}</td>
        <td>${statusBadge(r.status)}</td>
        <td>${sbData(r.data_emissao)}</td>
        <td class="crud-acts">
          <button class="btn-ed" onclick="abrirModalEditar('${r.id}')">✏️</button>
          <button class="btn-del" onclick="confirmarExcluir('${r.id}')">🗑️</button>
        </td>
      </tr>
    `).join('');
  }

  function aplicarFiltros() {
    const busca  = document.getElementById('campoBusca').value.toLowerCase();
    const status = document.getElementById('filtroStatus').value;
    const filtrado = registros.filter(r => {
      const textoOk  = !busca  || r.numero_nf.toLowerCase().includes(busca) || (r.clientes?.nome ?? '').toLowerCase().includes(busca);
      const statusOk = !status || r.status === status;
      return textoOk && statusOk;
    });
    renderTabela(filtrado);
  }

  async function popularSelects() {
    await Promise.all([
      sbPopularSelect('fCliente', 'clientes', 'ativo=eq.true&select=id,nome&order=nome.asc', 'id', 'nome', 'Selecione o cliente'),
      sbPopularSelect('fPedido', 'vendas_pedidos', 'select=id,numero&order=numero.desc', 'id', 'numero', 'Nenhum'),
      sbPopularSelect('fProduto', 'produtos', 'ativo=eq.true&select=id,nome&order=nome.asc', 'id', 'nome', 'Selecione o produto'),
      sbPopularSelect('fTransportadora', 'transportadoras', 'ativa=eq.true&select=id,nome&order=nome.asc', 'id', 'nome', 'Nenhuma'),
    ]);
  }

  function calcTotais() {
    const qtd       = parseFloat(document.getElementById('fQtd').value)       || 0;
    const valUnit   = parseFloat(document.getElementById('fValUnit').value)   || 0;
    const desconto  = parseFloat(document.getElementById('fDesconto').value)  || 0;
    const frete     = parseFloat(document.getElementById('fFrete').value)     || 0;
    const valICMS   = parseFloat(document.getElementById('fValICMS').value)   || 0;
    const valIPI    = parseFloat(document.getElementById('fValIPI').value)    || 0;
    const valProd   = qtd * valUnit;
    const total     = valProd - desconto + frete + valICMS + valIPI;
    document.getElementById('fValProd').value  = sbMoeda(valProd);
    document.getElementById('fValTotal').value = sbMoeda(total > 0 ? total : 0);
  }

  function resetForm() {
    ['fNroNF','fSerie','fDataEmissao','fNatureza','fEmitente','fCliente','fPedido',
     'fProduto','fQtd','fValUnit','fValProd','fDesconto','fFrete','fBaseICMS',
     'fValICMS','fValIPI','fValTotal','fTransportadora','fFreteConta','fQtdVol',
     'fPesoLiq','fPesoBruto','fInfoComp'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    document.getElementById('fStatus').value = 'Rascunho';
    document.getElementById('msgModal').style.display = 'none';
  }

  async function abrirModalNovo() {
    editId = null;
    document.getElementById('modalTitulo').textContent = 'Nova NF de Venda';
    resetForm();
    document.getElementById('fDataEmissao').value = new Date().toISOString().split('T')[0];
    await popularSelects();
    document.getElementById('modalBackdrop').style.display = 'flex';
  }

  async function abrirModalEditar(id) {
    editId = id;
    document.getElementById('modalTitulo').textContent = 'Editar NF de Venda';
    resetForm();
    const r = await sbBuscar('vendas_notas_fiscais', id);
    await popularSelects();
    document.getElementById('fNroNF').value       = r.numero_nf || '';
    document.getElementById('fSerie').value       = r.serie || '';
    document.getElementById('fDataEmissao').value = r.data_emissao || '';
    document.getElementById('fNatureza').value    = r.natureza_operacao || '';
    document.getElementById('fEmitente').value    = r.empresa_emitente || '';
    document.getElementById('fCliente').value     = r.cliente_id || '';
    document.getElementById('fPedido').value      = r.pedido_id || '';
    document.getElementById('fProduto').value     = r.produto_id || '';
    document.getElementById('fQtd').value         = r.quantidade || '';
    document.getElementById('fValUnit').value     = r.valor_unitario || '';
    document.getElementById('fDesconto').value    = r.desconto || '';
    document.getElementById('fFrete').value       = r.frete || '';
    document.getElementById('fBaseICMS').value    = r.base_icms || '';
    document.getElementById('fValICMS').value     = r.valor_icms || '';
    document.getElementById('fValIPI').value      = r.valor_ipi || '';
    document.getElementById('fTransportadora').value = r.transportadora_id || '';
    document.getElementById('fFreteConta').value  = r.frete_por_conta || '';
    document.getElementById('fQtdVol').value      = r.qtd_volumes || '';
    document.getElementById('fPesoLiq').value     = r.peso_liquido || '';
    document.getElementById('fPesoBruto').value   = r.peso_bruto || '';
    document.getElementById('fInfoComp').value    = r.informacoes_complementares || '';
    document.getElementById('fStatus').value      = r.status || 'Rascunho';
    calcTotais();
    document.getElementById('modalBackdrop').style.display = 'flex';
  }

  async function salvar() {
    const numero_nf          = document.getElementById('fNroNF').value.trim();
    const serie              = document.getElementById('fSerie').value.trim() || null;
    const data_emissao       = document.getElementById('fDataEmissao').value || null;
    const natureza_operacao  = document.getElementById('fNatureza').value.trim() || null;
    const empresa_emitente   = document.getElementById('fEmitente').value.trim();
    const cliente_id         = document.getElementById('fCliente').value || null;
    const pedido_id          = document.getElementById('fPedido').value || null;
    const produto_id         = document.getElementById('fProduto').value || null;
    const quantidade         = parseFloat(document.getElementById('fQtd').value) || null;
    const valor_unitario     = parseFloat(document.getElementById('fValUnit').value) || null;
    const valor_produtos     = (quantidade && valor_unitario) ? quantidade * valor_unitario : null;
    const desconto           = parseFloat(document.getElementById('fDesconto').value) || 0;
    const frete              = parseFloat(document.getElementById('fFrete').value) || 0;
    const base_icms          = parseFloat(document.getElementById('fBaseICMS').value) || null;
    const valor_icms         = parseFloat(document.getElementById('fValICMS').value) || 0;
    const valor_ipi          = parseFloat(document.getElementById('fValIPI').value) || 0;
    const valor_total        = valor_produtos ? valor_produtos - desconto + frete + valor_icms + valor_ipi : null;
    const transportadora_id  = document.getElementById('fTransportadora').value || null;
    const frete_por_conta    = document.getElementById('fFreteConta').value || null;
    const qtd_volumes        = parseInt(document.getElementById('fQtdVol').value) || null;
    const peso_liquido       = parseFloat(document.getElementById('fPesoLiq').value) || null;
    const peso_bruto         = parseFloat(document.getElementById('fPesoBruto').value) || null;
    const informacoes_complementares = document.getElementById('fInfoComp').value.trim() || null;
    const status             = document.getElementById('fStatus').value;

    if (!numero_nf) { mostrarMsgModal('Informe o número da NF.', 'err'); return; }
    if (!data_emissao) { mostrarMsgModal('Informe a data de emissão.', 'err'); return; }
    if (!empresa_emitente) { mostrarMsgModal('Informe a empresa emitente.', 'err'); return; }
    if (!cliente_id) { mostrarMsgModal('Selecione o cliente.', 'err'); return; }
    if (!produto_id) { mostrarMsgModal('Selecione o produto.', 'err'); return; }

    const dados = {
      numero_nf, serie, data_emissao, natureza_operacao, empresa_emitente,
      cliente_id, pedido_id, produto_id, quantidade, valor_unitario, valor_produtos,
      desconto, frete, base_icms, valor_icms, valor_ipi, valor_total,
      transportadora_id, frete_por_conta, qtd_volumes, peso_liquido, peso_bruto,
      informacoes_complementares, status
    };

    try {
      if (editId) {
        await sbAtualizar('vendas_notas_fiscais', editId, dados);
      } else {
        await sbInserir('vendas_notas_fiscais', dados);
      }
      fecharModal();
      sbMensagem('msgGlobal', editId ? 'NF atualizada com sucesso!' : 'NF criada com sucesso!', 'ok');
      document.getElementById('msgGlobal').style.display = 'block';
      await carregarDados();
    } catch (e) {
      mostrarMsgModal('Erro ao salvar: ' + e.message, 'err');
    }
  }

  function mostrarMsgModal(texto, tipo) {
    const el = document.getElementById('msgModal');
    el.textContent = texto;
    el.className   = 'crud-msg ' + tipo;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  async function confirmarExcluir(id) {
    if (!confirm('Tem certeza que deseja excluir esta NF? Esta ação não pode ser desfeita.')) return;
    try {
      await sbExcluir('vendas_notas_fiscais', id);
      sbMensagem('msgGlobal', 'NF excluída.', 'ok');
      document.getElementById('msgGlobal').style.display = 'block';
      await carregarDados();
    } catch (e) {
      sbMensagem('msgGlobal', 'Erro ao excluir: ' + e.message, 'err');
      document.getElementById('msgGlobal').style.display = 'block';
    }
  }

  function fecharModal() { document.getElementById('modalBackdrop').style.display = 'none'; }
  function backdropClick(e) { if (e.target === document.getElementById('modalBackdrop')) fecharModal(); }

  carregarDados();
</script>
<script>
  (function () {
    if (localStorage.getItem('erp_role') === 'Administrador') {
      var el = document.getElementById('linkAdmin');
      if (el) el.style.display = 'flex';
    }
  })();
</script>
</body>
</html>
