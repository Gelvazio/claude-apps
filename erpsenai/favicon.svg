<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#1e40af"/>
  <!-- Módulos: 4 quadrantes interligados representando o ERP -->
  <rect x="4" y="4" width="11" height="11" rx="2.5" fill="#60a5fa"/>
  <rect x="17" y="4" width="11" height="11" rx="2.5" fill="#93c5fd"/>
  <rect x="4" y="17" width="11" height="11" rx="2.5" fill="#93c5fd"/>
  <rect x="17" y="17" width="11" height="11" rx="2.5" fill="#bfdbfe"/>
  <!-- Conectores centrais -->
  <rect x="14.5" y="4" width="3" height="24" rx="1.5" fill="#1e40af"/>
  <rect x="4" y="14.5" width="24" height="3" rx="1.5" fill="#1e40af"/>
  <!-- Ponto central de integração -->
  <circle cx="16" cy="16" r="3" fill="white"/>
</svg>
