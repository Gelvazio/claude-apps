<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERP — Impostos</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .app-layout { display: flex; min-height: calc(100vh - 56px); }
    .sidebar { width: 240px; background: var(--color-surface); border-right: 1px solid var(--color-border-faint); display: flex; flex-direction: column; position: fixed; top: 56px; left: 0; bottom: 0; overflow-y: auto; z-index: 50; transition: transform .25s; }
    [data-theme="dark"] .sidebar { border-right-color: var(--color-border-light); }
    .sidebar-section { padding: 20px 0 4px; }
    .sidebar-section-label { font-size: 10px; font-weight: 700; color: var(--color-text-disabled); letter-spacing: 1.2px; text-transform: uppercase; padding: 0 20px 6px; }
    .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 9px 20px; font-size: 13px; font-weight: 500; color: var(--color-text-muted); text-decoration: none; border-left: 3px solid transparent; transition: background .15s, color .15s, border-color .15s; }
    .sidebar-link:hover { background: #e8f0fe; color: var(--color-primary); }
    .sidebar-link.ativo { background: #e8f0fe; color: var(--color-primary); border-left-color: var(--color-primary); font-weight: 600; }
    [data-theme="dark"] .sidebar-link:hover, [data-theme="dark"] .sidebar-link.ativo { background: #1e2554; color: #7aa3d4; }
    [data-theme="dark"] .sidebar-link.ativo { border-left-color: #7aa3d4; }
    .sidebar-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
    .main { margin-left: 240px; padding: 28px 32px; flex: 1; }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main { margin-left: 0; padding: 16px; } .sidebar.open { transform: translateX(0); } }
    .page-header { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .page-header h1 { font-size: 22px; font-weight: 700; color: var(--color-text); }
    .page-header p { font-size: 13px; color: var(--color-text-muted); margin-top: 2px; }
    .btn-menu { display: none; background: rgba(255,255,255,.15); border: none; color: #fff; font-size: 20px; width: 36px; height: 36px; border-radius: 6px; cursor: pointer; align-items: center; justify-content: center; }
    @media (max-width: 768px) { .btn-menu { display: flex; } }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 49; }
    .sidebar-overlay.show { display: block; }
    /* Toolbar */
    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 13px; background: var(--color-surface); color: var(--color-text); font-family: inherit; outline: none; }
    .search-input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(0,67,132,0.12); }
    [data-theme="dark"] .search-input { background: var(--color-surface-2); border-color: var(--color-border); color: var(--color-text); }
    .filter-btn { padding: 7px 14px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 12px; font-weight: 600; background: var(--color-surface); color: var(--color-text-muted); cursor: pointer; font-family: inherit; transition: all .15s; }
    .filter-btn.ativo { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .filter-btn:hover:not(.ativo) { background: var(--color-surface-2); }
    /* Seção tabela */
    .content-section { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
    /* Feedback global */
    #msgGlobal { display: none; padding: 10px 16px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; margin-bottom: 14px; }
    #msgGlobal.ok  { background: var(--color-success-bg); border: 1px solid var(--color-success-border); color: var(--color-success); display: block; }
    #msgGlobal.err { background: var(--color-error-bg); border: 1px solid var(--color-error-border); color: var(--color-error); display: block; }
    /* Modal */
    .crud-modal { max-width: 560px !important; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid .span-2 { grid-column: span 2; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .form-grid .span-2 { grid-column: span 1; } }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 10px; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.3px; }
    .form-label span { color: var(--color-error); }
    .form-input, .form-select { width: 100%; padding: 9px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 13px; color: var(--color-text); background: var(--color-surface-3); font-family: inherit; outline: none; transition: border-color .15s, box-shadow .15s; }
    .form-input:focus, .form-select:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(0,67,132,0.12); }
    [data-theme="dark"] .form-input, [data-theme="dark"] .form-select { background: var(--color-surface-2); border-color: var(--color-border); color: var(--color-text); }
    /* Toggle ativo */
    .toggle-wrap { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
    .toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: #ccc; border-radius: 24px; cursor: pointer; transition: background .2s; }
    .toggle-slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: transform .2s; }
    .toggle input:checked + .toggle-slider { background: var(--color-success); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }
    .toggle-label { font-size: 13px; color: var(--color-text-secondary); }
    /* Modal footer */
    .modal-footer { padding: 12px 20px; display: flex; justify-content: center; gap: 10px; border-top: 1px solid var(--color-border-light); background: var(--color-surface-2); }
    .modal-body-scroll { overflow-y: auto; padding: 20px; flex: 1; }
    /* Paginação */
    .paginacao { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--color-border-faint); font-size: 12px; color: var(--color-text-muted); }
    .paginacao-btns { display: flex; gap: 6px; }
    .pag-btn { padding: 4px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text-muted); font-size: 12px; cursor: pointer; font-family: inherit; }
    .pag-btn:disabled { opacity: 0.4; cursor: default; }
    .pag-btn:not(:disabled):hover { background: var(--color-surface-2); }
    /* Taxa badge */
    .taxa-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 700; background: #e8f0fe; color: var(--color-primary); font-family: monospace; }
    [data-theme="dark"] .taxa-badge { background: #1e2554; color: #7aa3d4; }
  </style>
  <script>
    (function () {
      const t = localStorage.getItem('senai_tema') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="../gamificacao/gamif.js"></script>
</head>
<body>

<!-- Header -->
<header class="header">
  <button class="btn-menu" id="btnMenu" onclick="toggleSidebar()">☰</button>
  <a class="header-logo" href="../dashboard.html">ERP</a>
  <span class="header-title">Senai</span>
  <span class="header-spacer"></span>
  <span class="role-badge" id="roleBadge"></span>
  <button class="header-btn" id="btnTema" style="min-width:96px">🌙 Escuro</button>
  <button class="header-btn" onclick="sair()">🚪 Sair</button>
</header>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Main -->
  <main class="main">
    <div class="page-header">
      <div>
        <h1>🧾 Impostos</h1>
        <p>Cadastro de tipos de impostos e suas alíquotas</p>
      </div>
      <button class="btn" onclick="abrirModalNovo()">+ Novo Imposto</button>
    </div>

    <div id="msgGlobal"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <input class="search-input" type="text" id="campoBusca" placeholder="🔍  Buscar por descrição..." oninput="filtrar()">
      <button class="filter-btn ativo" data-filtro="todos" onclick="setFiltro('todos',this)">Todos</button>
      <button class="filter-btn" data-filtro="ativos" onclick="setFiltro('ativos',this)">Ativos</button>
      <button class="filter-btn" data-filtro="inativos" onclick="setFiltro('inativos',this)">Inativos</button>
    </div>

    <!-- Tabela -->
    <div class="content-section">
      <div class="crud-table-wrap">
        <table class="crud-table">
          <thead>
            <tr>
              <th>Descrição</th>
              <th style="width:160px">Taxa (%)</th>
              <th style="width:100px">Status</th>
              <th style="width:100px">Ações</th>
            </tr>
          </thead>
          <tbody id="tbodyImpostos">
            <tr><td colspan="4" class="crud-vazio">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="paginacao">
        <span id="paginacaoInfo">—</span>
        <div class="paginacao-btns">
          <button class="pag-btn" id="btnAnterior" onclick="mudarPagina(-1)">‹ Anterior</button>
          <button class="pag-btn" id="btnProximo" onclick="mudarPagina(1)">Próxima ›</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ── Modal Formulário ── -->
<div class="crud-backdrop" id="modalFormulario" style="display:none" onclick="fecharSeClicouFora(event,'modalFormulario')">
  <div class="crud-modal">
    <div class="crud-modal-head">
      <h3 id="modalTitulo">Novo Imposto</h3>
      <button class="crud-btn-fechar" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-body-scroll">
      <div id="msgModal" style="display:none;margin-bottom:12px;padding:10px 14px;border-radius:6px;font-size:13px;font-weight:600;"></div>
      <form id="formImposto" onsubmit="salvar(event)">
        <div class="form-grid">
          <div class="form-group span-2">
            <label class="form-label" for="fDescricao">Descrição <span>*</span></label>
            <input class="form-input" type="text" id="fDescricao" required
              placeholder="Ex: ICMS, IPI, PIS, COFINS, ISS…"
              style="font-size:16px">
          </div>
          <div class="form-group span-2">
            <label class="form-label" for="fTaxa">Taxa de Imposto (%) <span>*</span></label>
            <input class="form-input" type="number" id="fTaxa" required
              min="0" max="100" step="0.0001"
              placeholder="Ex: 12.5"
              style="font-size:16px">
          </div>
          <div class="form-group span-2">
            <div class="toggle-wrap">
              <label class="toggle">
                <input type="checkbox" id="fAtivo" checked>
                <span class="toggle-slider"></span>
              </label>
              <span class="toggle-label">Imposto ativo</span>
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" onclick="document.getElementById('formImposto').requestSubmit()">Confirmar</button>
    </div>
  </div>
</div>

<!-- ── Modal Confirmar Exclusão ── -->
<div class="crud-backdrop" id="modalExcluir" style="display:none" onclick="fecharSeClicouFora(event,'modalExcluir')">
  <div class="crud-modal" style="max-width:440px">
    <div class="crud-modal-head" style="background:#c62828">
      <h3>Confirmar Exclusão</h3>
      <button class="crud-btn-fechar" onclick="fecharModalExcluir()">✕</button>
    </div>
    <div class="modal-body-scroll" style="padding:20px">
      <p style="font-size:14px;color:var(--color-text)">Tem certeza que deseja excluir o imposto <strong id="nomeExcluir"></strong>?</p>
      <p style="font-size:12px;color:var(--color-text-muted);margin-top:8px">Esta ação não pode ser desfeita.</p>
    </div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModalExcluir()">Cancelar</button>
      <button class="btn-salvar" style="background:#c62828" onclick="excluirConfirmado()">🗑️ Excluir</button>
    </div>
  </div>
</div>

<script src="../menu.js"></script>
<script src="../SUPABASE.js"></script>
<script>
  sbVerificarSessao();
  sbExigirPermissao('cadastros');

  document.getElementById('roleBadge').textContent = sbPerfil() || '';

  (function () {
    const t = localStorage.getItem('senai_tema') || 'light';
    const btn = document.getElementById('btnTema');
    btn.textContent = t === 'dark' ? '☀️ Claro' : '🌙 Escuro';
    btn.onclick = () => {
      const novo = sbToggleTema();
      btn.textContent = novo === 'dark' ? '☀️ Claro' : '🌙 Escuro';
    };
  })();

  function sair() { sbLogout('../index.html'); }
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
  }

  // ── Estado ──
  let todos = [];
  let filtrados = [];
  let filtroAtual = 'todos';
  let paginaAtual = 0;
  const POR_PAGINA = 50;
  let idParaExcluir = null;
  let modoEdicao = false;
  let idEdicao = null;

  // ── Formatar taxa ──
  function formatarTaxa(valor) {
    if (valor === null || valor === undefined || valor === '') return '—';
    return Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 4 }) + '%';
  }

  // ── Mensagens ──
  function msg(texto, tipo = 'ok', ms = 4000) {
    const el = document.getElementById('msgGlobal');
    el.textContent = texto; el.className = tipo; el.style.display = 'block';
    if (ms > 0) setTimeout(() => { el.style.display = 'none'; }, ms);
  }

  function msgModal(texto, tipo = 'err') {
    const el = document.getElementById('msgModal');
    el.textContent = texto;
    el.style.cssText = tipo === 'err'
      ? 'display:block;background:#fce8e6;border:1px solid #f44336;color:#c62828'
      : 'display:block;background:#e8f5e9;border:1px solid #c8e6c9;color:#2e7d32';
  }

  // ── Carregar ──
  async function carregar() {
    document.getElementById('tbodyImpostos').innerHTML = '<tr><td colspan="4" class="crud-vazio">Carregando…</td></tr>';
    try {
      todos = await sbListar('impostos', 'order=descricao.asc');
      filtrar();
    } catch (e) {
      document.getElementById('tbodyImpostos').innerHTML = `<tr><td colspan="4" class="crud-vazio">Erro ao carregar: ${e.message}</td></tr>`;
    }
  }

  // ── Filtrar ──
  function setFiltro(f, el) {
    filtroAtual = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('ativo'));
    el.classList.add('ativo');
    paginaAtual = 0;
    filtrar();
  }

  function filtrar() {
    const termo = document.getElementById('campoBusca').value.toLowerCase().trim();
    filtrados = todos.filter(r => {
      if (filtroAtual === 'ativos'   && !r.ativo) return false;
      if (filtroAtual === 'inativos' &&  r.ativo) return false;
      if (termo) return (r.descricao || '').toLowerCase().includes(termo);
      return true;
    });
    renderTabela();
  }

  function renderTabela() {
    const tbody = document.getElementById('tbodyImpostos');
    const inicio = paginaAtual * POR_PAGINA;
    const pagina = filtrados.slice(inicio, inicio + POR_PAGINA);

    document.getElementById('paginacaoInfo').textContent =
      `${filtrados.length} registro(s) · página ${paginaAtual + 1} de ${Math.max(1, Math.ceil(filtrados.length / POR_PAGINA))}`;
    document.getElementById('btnAnterior').disabled = paginaAtual === 0;
    document.getElementById('btnProximo').disabled  = inicio + POR_PAGINA >= filtrados.length;

    if (!pagina.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="crud-vazio">Nenhum imposto encontrado.</td></tr>';
      return;
    }

    tbody.innerHTML = pagina.map(r => `
      <tr>
        <td>${r.descricao || '—'}</td>
        <td><span class="taxa-badge">${formatarTaxa(r.taxa_imposto)}</span></td>
        <td>${r.ativo
          ? '<span class="badge badge-verde">Ativo</span>'
          : '<span class="badge badge-vermelho">Inativo</span>'}</td>
        <td class="crud-acts">
          <button class="btn-ed"  title="Editar"  onclick="abrirModalEditar('${r.id}')">✏️</button>
          <button class="btn-del" title="Excluir" onclick="confirmarExcluir('${r.id}','${(r.descricao || '').replace(/'/g, "\\'")}')">🗑️</button>
        </td>
      </tr>
    `).join('');
  }

  function mudarPagina(dir) {
    paginaAtual += dir;
    renderTabela();
    window.scrollTo(0, 0);
  }

  // ── Modal ──
  function abrirModalNovo() {
    modoEdicao = false; idEdicao = null;
    document.getElementById('modalTitulo').textContent = 'Novo Imposto';
    document.getElementById('formImposto').reset();
    document.getElementById('fAtivo').checked = true;
    document.getElementById('msgModal').style.display = 'none';
    document.getElementById('modalFormulario').style.display = 'flex';
    document.getElementById('fDescricao').focus();
  }

  function abrirModalEditar(id) {
    modoEdicao = true; idEdicao = id;
    document.getElementById('modalTitulo').textContent = 'Editar Imposto';
    document.getElementById('msgModal').style.display = 'none';
    const r = todos.find(x => x.id === id);
    if (!r) return;
    document.getElementById('fDescricao').value = r.descricao || '';
    document.getElementById('fTaxa').value      = r.taxa_imposto !== null ? r.taxa_imposto : '';
    document.getElementById('fAtivo').checked   = r.ativo !== false;
    document.getElementById('modalFormulario').style.display = 'flex';
    document.getElementById('fDescricao').focus();
  }

  function fecharModal() {
    document.getElementById('modalFormulario').style.display = 'none';
  }

  function fecharSeClicouFora(e, id) {
    if (e.target.id === id) document.getElementById(id).style.display = 'none';
  }

  // ── Salvar ──
  async function salvar(e) {
    e.preventDefault();

    const descricao    = document.getElementById('fDescricao').value.trim();
    const taxaStr      = document.getElementById('fTaxa').value.trim();
    const taxaImposto  = taxaStr !== '' ? parseFloat(taxaStr) : null;

    if (!descricao) { msgModal('Descrição é obrigatória.'); return; }
    if (taxaStr === '' || taxaImposto === null) { msgModal('Taxa de Imposto é obrigatória.'); return; }
    if (isNaN(taxaImposto) || taxaImposto < 0 || taxaImposto > 100) {
      msgModal('Taxa de Imposto deve ser um número entre 0 e 100.'); return;
    }

    const dados = {
      descricao,
      taxa_imposto: taxaImposto,
      ativo: document.getElementById('fAtivo').checked,
    };

    try {
      if (modoEdicao) {
        await sbAtualizar('impostos', idEdicao, dados);
        msg('Imposto atualizado com sucesso!', 'ok');
      } else {
        await sbInserir('impostos', dados);
        msg('Imposto cadastrado com sucesso!', 'ok');
      }
      fecharModal();
      await carregar();
    } catch (er) {
      msgModal('Erro ao salvar: ' + er.message);
    }
  }

  // ── Excluir ──
  function confirmarExcluir(id, nome) {
    idParaExcluir = id;
    document.getElementById('nomeExcluir').textContent = nome;
    document.getElementById('modalExcluir').style.display = 'flex';
  }

  function fecharModalExcluir() {
    document.getElementById('modalExcluir').style.display = 'none';
    idParaExcluir = null;
  }

  async function excluirConfirmado() {
    if (!idParaExcluir) return;
    try {
      await sbExcluir('impostos', idParaExcluir);
      msg('Imposto excluído com sucesso.', 'ok');
      fecharModalExcluir();
      await carregar();
    } catch (e) {
      fecharModalExcluir();
      msg('Erro ao excluir: ' + e.message, 'err');
    }
  }

  // ── Inicializar ──
  carregar();
</script>
<script>
  (function () {
    if (localStorage.getItem('erp_role') === 'Administrador') {
      var el = document.getElementById('linkAdmin');
      if (el) el.style.display = 'flex';
    }
  })();
</script>
</body>
</html>
