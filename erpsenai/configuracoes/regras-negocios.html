const CLAUDE_MD = `# ERP Senai — Regras de Negócios

> Documento de referência para os módulos do sistema ERP. Versão: 2026.

---

## Visão Geral do Sistema

Sistema ERP (Enterprise Resource Planning) voltado para gestão integrada de cadastros, compras, estoque, vendas e logística.

### Princípios Fundamentais

- Campos marcados com \`*\` são **obrigatórios** — validação no frontend e backend.
- Campos com numeração automática (\`P00001\`, \`SC00001\`, \`PC00001\`) são **gerados pelo sistema**, sequenciais, **nunca editáveis**.
- Todo registro deve ter campo de **Observações** livre para anotações.
- O sistema mantém **rastreabilidade** entre módulos: Pedido de Venda pode ser rastreado até a Entrega.
- Registros com campo **Ativo/Ativa** permitem desativação sem exclusão (soft delete).

---

## Módulo 1 — CADASTROS

Módulo base do sistema. Todos os demais módulos dependem dos cadastros aqui realizados.

### 1.1 Clientes

Cadastro de clientes pessoa física ou jurídica.

| Campo | Tipo | Regras |
|-------|------|--------|
| Nome / Razão Social | Texto | **Obrigatório** |
| CNPJ / CPF | Texto | Validação de formato CPF (000.000.000-00) ou CNPJ (00.000.000/0001-00) |
| E-mail | E-mail | Validação de formato |
| Telefone | Texto | Máscara de telefone brasileiro |
| Segmento | Select | Tecnologia, Saúde, Varejo, Alimentação, Automobilístico, Metalmecânica, Madeireiro, Serviços, Agricultura, Transporte, Outros |
| Endereço | Texto | — |
| Cidade | Select | Carregado via IBGE por estado |
| Estado | Select | 27 UFs brasileiras (sigla) |
| CEP | Texto | Máscara 00000-000; autopreenchimento via ViaCEP |
| Ativo | Toggle | Default: Ativo. Inativo oculta o cliente de seleções em outros módulos |

**Regras de negócio:**
- Não permitir CNPJ/CPF duplicado.
- Cliente inativo não deve aparecer em selects de Pedido de Venda, Romaneio, Entrega etc.
- Ao pesquisar por CEP via ViaCEP, preencher automaticamente Endereço, Cidade e Estado.

### 1.2 Fornecedores

Cadastro de fornecedores (sempre pessoa jurídica).

| Campo | Tipo | Regras |
|-------|------|--------|
| Nome / Razão Social | Texto | **Obrigatório** |
| CNPJ | Texto | Validação de formato CNPJ |
| Contato | Texto | Nome da pessoa de contato |
| E-mail | E-mail | Validação de formato |
| Telefone | Texto | Máscara de telefone |
| Segmento | Select | Mesmos segmentos de Clientes |
| Endereço, Cidade, Estado, CEP | Texto | CEP com autopreenchimento via ViaCEP |
| Ativo | Toggle | Default: Ativo |

**Regras de negócio:**
- Não permitir CNPJ duplicado.
- Fornecedor inativo não aparece em selects de Pedido de Compras, Recebimento etc.

### 1.3 Produtos

| Campo | Tipo | Regras |
|-------|------|--------|
| Código | Texto | **Gerado automaticamente** — Formato: \`P00001\` (nunca editável) |
| Nome do Produto | Texto | **Obrigatório** |
| Categoria | Select | Tecnologia, Saúde, Varejo, Alimentação, Automobilístico, Metalmecânica, Madeireiro, Serviços, Agricultura, Transporte, Embalagens, Manutenção e Reparos, Outros |
| Unidade | Select | UN, KG, LT, CX, PC, MT |
| Preço de Custo / Venda | Número | Formato R$ 1.000,00 |
| Estoque Atual | Número | **Atualizado automaticamente** por movimentações — nunca editado manualmente |
| Estoque Mínimo / Máximo | Número | Alerta visual quando Estoque Atual ≤ Mínimo |
| Imagem | Upload | JPG, PNG |
| Ativo | Toggle | Default: Ativo |

**Regras de negócio:**
- O **Estoque Atual** é calculado automaticamente (entradas via Recebimento de Compra; saídas via Expedição).
- Exibir **alerta visual** quando \`Estoque Atual ≤ Estoque Mínimo\`.

### 1.4 Transportadoras

| Campo | Tipo | Regras |
|-------|------|--------|
| Nome | Texto | **Obrigatório** |
| CNPJ | Texto | Validação CNPJ |
| Tipo de Serviço | Select | Rodoviário, Aéreo, Marítimo, Expresso |
| Contato, E-mail, Telefone | Texto | — |
| Cidade, Estado | — | Estado + Cidade via IBGE |
| Ativa | Toggle | Default: Ativa |

---

## Módulo 2 — COMPRAS

### Fluxo

\`\`\`
Planejamento → Solicitação de Compras → Pedido de Compras → Recebimento → Conferência → Entrada de Nota Fiscal
\`\`\`

### 2.1 Planejamento

| Campo | Tipo | Regras |
|-------|------|--------|
| Título | Texto | **Obrigatório** |
| Tipo | Select | Mensal, Trimestral, Anual |
| Produto | Select | Produtos ativos |
| Período | Texto | Mês/Ano ou intervalo |
| Qtd. Planejada / Realizada | Número | — |
| Status | Select | Em Planejamento, Em Andamento, Concluído, Cancelado |

### 2.2 Solicitação de Compras (SC)

| Campo | Tipo | Regras |
|-------|------|--------|
| Número da Solicitação | Texto | **Gerado automaticamente** — \`SC00001\` |
| Produto | Select | **Obrigatório** |
| Quantidade | Número | **Obrigatório** |
| Unidade | Texto | Preenchida automaticamente pelo produto |
| Prioridade | Select | Baixa, Média, Alta, Urgente |
| Status | Select | Pendente, Em Análise, Aprovada, Reprovada, Cancelada |

### 2.3 Pedido de Compras (PC)

| Campo | Tipo | Regras |
|-------|------|--------|
| Número do Pedido | Texto | **Gerado automaticamente** — \`PC00001\` |
| Solicitação de Compras | Select | SC vinculada (opcional) |
| Fornecedor | Select | **Obrigatório** — fornecedores ativos |
| Produto, Quantidade | — | **Obrigatórios** |
| Preço Unitário | Número | R$ |
| Valor Total | Número | **Calculado automaticamente**: Qtd × Preço Unitário |
| Status | Select | Rascunho, Enviado, Confirmado, Cancelado, Recebido |
| Data Prevista | Data | Previsão de entrega |

**Ação especial:** Botão **"Salvar como PDF"** — gera PDF com dados do pedido para envio ao fornecedor.

### 2.4 Recebimento (RC)

Número gerado: \`RC00001\`. Registra chegada física da mercadoria. Status: Aguardando, Recebido Parcial, Recebido Total, Com Divergência.

### 2.5 Conferência

Verifica conformidade do recebido. Status: Aprovado, Reprovado, Em Análise, Pendente.

### 2.6 Entrada de Nota Fiscal

**Regra:** Ao confirmar NF como "Lançada", o sistema atualiza automaticamente o **Estoque Atual** do produto (entrada).

---

## Módulo 3 — ESTOQUE

### 3.1 Armazenagem / Movimentações

Número: \`MV00001\`. Tipo: Entrada, Saída, Transferência.

### 3.2 Controle de Estoque

Painel somente leitura. Indicadores visuais:
- 🟢 Normal: \`Estoque Atual > Mínimo\`
- 🟡 Atenção: \`Estoque Atual = Mínimo\`
- 🔴 Crítico: \`Estoque Atual < Mínimo\`

### 3.3 Inventário (INV)

Número: \`INV00001\`. Campo **Diferença** = Qtd. Contada − Qtd. Sistema (calculado automaticamente).

**Regra:** Ao marcar inventário como "Ajustado", o sistema gera automaticamente uma Movimentação de ajuste para corrigir o Estoque Atual.

---

## Módulo 4 — VENDAS

### 4.1 Pedido de Venda (PV)

Número: \`PV00001\`. Múltiplos produtos por pedido.

**Regras:**
- Ao confirmar, verificar estoque disponível. Alertar se \`Qtd. Pedida > Estoque Atual\`.
- Status: Rascunho, Confirmado, Em Separação, Em Expedição, Entregue, Cancelado.

### 4.2 Nota Fiscal de Venda

Campos fiscais: Base ICMS, Valor ICMS, Valor IPI, Frete, Desconto, Valor Total (calculado).

---

## Módulo 5 — LOGÍSTICA

### Fluxo

\`\`\`
Pedido de Venda → Financeiro → Nota Fiscal → Separação → Romaneio → Expedição → Entrega
\`\`\`

### 5.1 Pipeline (Logística)

Cada pedido de venda possui uma **etapa** que representa sua posição no fluxo logístico. O pipeline exibe o total de pedidos por etapa.

### 5.2 Separação (SEP)

Número: \`SEP00001\`. Status: Pendente, Em Separação, Concluído, Com Divergência.

### 5.3 Romaneio (ROM)

Número: \`ROM00001\`. Lista itens a serem despachados em uma operação de entrega.

### 5.4 Expedição (EXP)

Número: \`EXP00001\`. **Regra:** Ao confirmar como "Expedido", o sistema baixa o estoque do produto (saída de estoque).

### 5.5 Entrega (ENT)

Número: \`ENT00001\`. Rastreamento via código fornecido pela transportadora.

---

## Módulo 6 — FINANCEIRO

### 6.1 Contas a Pagar

Número: \`CP00001\`. Tipos de conta: Passivo, Passivo Circulante, Ativo, Frota, Depreciação, Financiamento, Empréstimo, Folha de Pagamento, Impostos e Tributos, Aluguel, Utilities, Fornecedores, Outros.

Status: Em Aberto, Pago, Vencido, Cancelado. Contas em aberto após a data de vencimento tornam-se automaticamente **Vencidas**.

### 6.2 Contas a Receber

Número: \`CR00001\`. Tipos de conta: Ativo, Ativo Circulante, Receita de Vendas, Receita de Serviços, Adiantamentos, Dividendos, Aluguéis a Receber, Juros e Multas, Outros.

Status: Em Aberto, Recebido, Em Atraso, Cancelado.

### 6.3 Balancete Gerencial

Consolida Contas a Pagar e Contas a Receber. Exibe:
- Total a Pagar × Total a Receber
- Resultado do período (Superávit ou Déficit)
- Inadimplência (recebimentos em atraso)
- Gráfico comparativo por tipo de conta
- Lançamentos detalhados do período

---

## Módulo 7 — CONFIGURAÇÕES

### 7.1 Usuários

| Perfil | Acesso |
|--------|--------|
| Administrador | Total — todos os módulos e Configurações |
| Usuário | Restrito — apenas módulos com permissão marcada |

**Regras:**
- Usuário inativo não consegue fazer login.
- Deve existir ao menos **um Administrador ativo** em todo momento.
- Sessão expira em **8 horas**.

### 7.2 Perfis e Telas

Perfis agrupam conjuntos de telas permitidas. O administrador vincula telas a cada perfil. O sistema oculta automaticamente da sidebar as telas não autorizadas para o perfil do usuário logado.

---

## Numeração Automática

| Entidade | Prefixo | Exemplo |
|----------|---------|---------|
| Produto | P | P00001 |
| Solicitação de Compras | SC | SC00001 |
| Pedido de Compras | PC | PC00001 |
| Recebimento | RC | RC00001 |
| Movimentação | MV | MV00001 |
| Inventário | INV | INV00001 |
| Pedido de Venda | PV | PV00001 |
| Romaneio | ROM | ROM00001 |
| Separação | SEP | SEP00001 |
| Expedição | EXP | EXP00001 |
| Entrega | ENT | ENT00001 |
| Contas a Pagar | CP | CP00001 |
| Contas a Receber | CR | CR00001 |

---

## Regras Gerais de Interface

### Listagens
- Toda listagem tem: busca por texto, filtro por status, ordenação por coluna, paginação.
- Ações por registro: **Editar**, **Visualizar**, **Excluir**.
- Confirmação antes de excluir: modal "Tem certeza que deseja excluir este registro? Esta ação não pode ser desfeita."

### Formulários
- Validação em tempo real dos campos obrigatórios.
- Ao selecionar registro vinculado, preencher automaticamente campos derivados.
- Botões: **Confirmar** / **Cancelar**.

### Responsividade
- Sistema 100% utilizável no celular, sem rolagem horizontal.
- Sidebar oculta por padrão em telas ≤ 768px, abre via botão ☰.
- Inputs com font-size ≥ 16px para evitar zoom automático no iOS.
`;

// Render markdown
const rendered = marked.parse(CLAUDE_MD);
document.getElementById('mdBody').innerHTML = rendered;

// Build TOC from h2
const toc = document.getElementById('tocList');
document.querySelectorAll('.md-body h2, .md-body h1').forEach((h, i) => {
  const id = 'section-' + i;
  h.id = id;
  const a = document.createElement('a');
  a.className = 'toc-link';
  a.href = '#' + id;
  a.textContent = h.textContent.replace(/^#+\s*/, '');
  toc.appendChild(a);
});

// Search highlight
let originalHTML = document.getElementById('mdBody').innerHTML;
function pesquisar() {
  const term = document.getElementById('busca').value.trim();
  const body = document.getElementById('mdBody');
  if (!term) {
    body.innerHTML = originalHTML;
    // Re-attach IDs
    body.querySelectorAll('h2, h1').forEach((h, i) => { h.id = 'section-' + i; });
    return;
  }
  const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  body.innerHTML = originalHTML.replace(re, '<mark class="highlight-match">$1</mark>');
  // Re-attach IDs
  body.querySelectorAll('h2, h1').forEach((h, i) => { h.id = 'section-' + i; });
}
</script>
