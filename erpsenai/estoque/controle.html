<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERP — Controle de Estoque</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    /* ── Layout ── */
    .app-layout { display: flex; min-height: calc(100vh - 56px); }

    /* ── Sidebar ── */
    .sidebar { width: 240px; background: var(--color-surface); border-right: 1px solid var(--color-border-faint); display: flex; flex-direction: column; position: fixed; top: 56px; left: 0; bottom: 0; overflow-y: auto; z-index: 50; transition: transform .25s; }
    [data-theme="dark"] .sidebar { background: var(--color-surface); border-right-color: var(--color-border-light); }

    .sidebar-section { padding: 20px 0 4px; }
    .sidebar-section-label { font-size: 10px; font-weight: 700; color: var(--color-text-disabled); letter-spacing: 1.2px; text-transform: uppercase; padding: 0 20px 6px; }
    .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 9px 20px; font-size: 13px; font-weight: 500; color: var(--color-text-muted); text-decoration: none; border-left: 3px solid transparent; transition: background .15s, color .15s, border-color .15s; }
    .sidebar-link:hover { background: #e8f0fe; color: var(--color-primary); }
    .sidebar-link.ativo { background: #e8f0fe; color: var(--color-primary); border-left-color: var(--color-primary); font-weight: 600; }
    [data-theme="dark"] .sidebar-link:hover, [data-theme="dark"] .sidebar-link.ativo { background: #1e2554; color: #7aa3d4; }
    [data-theme="dark"] .sidebar-link.ativo { border-left-color: #7aa3d4; }
    .sidebar-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }

    /* ── Principal ── */
    .main { margin-left: 240px; padding: 28px 32px; flex: 1; }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main { margin-left: 0; padding: 16px; } .sidebar.open { transform: translateX(0); } }

    /* ── Page Header ── */
    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 22px; font-weight: 700; color: var(--color-text); }
    .page-header p { font-size: 13px; color: var(--color-text-muted); margin-top: 2px; }

    /* ── Cards de resumo ── */
    .resumo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .resumo-card { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; border-left: 4px solid transparent; }
    .resumo-card.verde  { border-left-color: #2e7d32; }
    .resumo-card.laranja { border-left-color: #f7941d; }
    .resumo-card.vermelho { border-left-color: #c62828; }
    .resumo-label { font-size: 11px; font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .5px; }
    .resumo-value { font-size: 28px; font-weight: 800; color: var(--color-text); line-height: 1; }
    .resumo-card.vermelho .resumo-value { color: #c62828; }
    .resumo-card.laranja .resumo-value { color: #b06000; }
    .resumo-card.verde .resumo-value { color: #2e7d32; }

    /* ── Toolbar ── */
    .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .search-input { flex: 1; min-width: 180px; padding: 8px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 13px; background: var(--color-surface); color: var(--color-text); }
    .search-input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(0,67,132,.15); }
    .form-select { padding: 8px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 13px; background: var(--color-surface); color: var(--color-text); cursor: pointer; }
    .form-select:focus { outline: none; border-color: var(--color-primary); }
    [data-theme="dark"] .search-input, [data-theme="dark"] .form-select { background: #22252e; border-color: var(--color-border-light); color: var(--color-text); }

    /* ── Tabela ── */
    .table-wrap { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
    .table-header { padding: 16px 20px; border-bottom: 1px solid var(--color-border-faint); display: flex; align-items: center; justify-content: space-between; }
    .table-title { font-size: 14px; font-weight: 700; color: var(--color-text); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { text-align: left; padding: 10px 16px; font-size: 10px; font-weight: 700; color: var(--color-primary); text-transform: uppercase; letter-spacing: .4px; border-bottom: 2px solid var(--color-border-faint); white-space: nowrap; background: var(--color-surface); }
    tbody td { padding: 11px 16px; border-bottom: 1px solid var(--color-border-faint); color: var(--color-text-secondary); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #f5f8ff; }
    [data-theme="dark"] thead th { color: #7aa3d4; border-bottom-color: var(--color-border-light); }
    [data-theme="dark"] tbody td { color: var(--color-text-secondary); border-bottom-color: var(--color-border-light); }
    [data-theme="dark"] tbody tr:hover td { background: #22252e; }

    /* ── Badges de status ── */
    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
    .badge-verde   { background: #e8f5e9; color: #2e7d32; }
    .badge-laranja { background: #fff3e0; color: #b06000; }
    .badge-vermelho { background: #fce8e6; color: #c62828; }

    /* ── Vazio ── */
    .vazio { text-align: center; color: var(--color-text-faint); font-size: 13px; padding: 32px; font-style: italic; }

    /* ── Hamburguer ── */
    .btn-menu { display: none; background: rgba(255,255,255,.15); border: none; color: #fff; font-size: 20px; width: 36px; height: 36px; border-radius: 6px; cursor: pointer; align-items: center; justify-content: center; }
    @media (max-width: 768px) { .btn-menu { display: flex; } }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 49; }
    .sidebar-overlay.show { display: block; }

    /* ── Estoque numérico ── */
    .num-estoque { font-weight: 600; font-family: monospace; }
    .num-critico { color: #c62828; }
    .num-atencao { color: #b06000; }
    .num-normal  { color: #2e7d32; }

    /* ── Paginação ── */
    .paginacao { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--color-border-faint); font-size: 12px; color: var(--color-text-muted); }
    .btn-pag { background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--color-text-muted); }
    .btn-pag:hover:not(:disabled) { background: #e8f0fe; color: var(--color-primary); }
    .btn-pag:disabled { opacity: .4; cursor: default; }
  </style>
  <script>
    (function () {
      const t = localStorage.getItem('senai_tema') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

<!-- ── Header ─────────────────────────────────── -->
<header class="header">
  <button class="btn-menu" id="btnMenu" onclick="toggleSidebar()">☰</button>
  <a class="header-logo" href="../dashboard.html">ERP</a>
  <span class="header-title">Senai</span>
  <span class="header-spacer"></span>
  <span class="role-badge" id="roleBadge"></span>
  <button class="header-btn" id="btnTema" onclick="alternarTema()" style="min-width:96px">🌙 Escuro</button>
  <button class="header-btn" onclick="sair()">🚪 Sair</button>
</header>

<!-- ── Overlay mobile ─────────────────────────── -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- ── Layout ─────────────────────────────────── -->
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Conteúdo -->
  <main class="main">

    <div class="page-header">
      <h1>📊 Controle de Estoque</h1>
      <p>Painel de visão geral do estoque de todos os produtos ativos</p>
    </div>

    <!-- Cards de resumo -->
    <div class="resumo-grid">
      <div class="resumo-card verde">
        <div class="resumo-label">Normal</div>
        <div class="resumo-value" id="cntNormal">—</div>
      </div>
      <div class="resumo-card laranja">
        <div class="resumo-label">Atenção</div>
        <div class="resumo-value" id="cntAtencao">—</div>
      </div>
      <div class="resumo-card vermelho">
        <div class="resumo-label">Crítico</div>
        <div class="resumo-value" id="cntCritico">—</div>
      </div>
      <div class="resumo-card" style="border-left-color:#004384">
        <div class="resumo-label">Total Produtos</div>
        <div class="resumo-value" id="cntTotal" style="color:#004384">—</div>
      </div>
    </div>

    <!-- Toolbar de filtros -->
    <div class="toolbar">
      <input type="text" class="search-input" id="busca" placeholder="Buscar por nome ou código…" oninput="filtrar()">
      <select class="form-select" id="filtroStatus" onchange="filtrar()">
        <option value="">Todos os status</option>
        <option value="normal">Normal</option>
        <option value="atencao">Atenção</option>
        <option value="critico">Crítico</option>
      </select>
      <select class="form-select" id="filtroCategoria" onchange="filtrar()">
        <option value="">Todas as categorias</option>
      </select>
    </div>

    <!-- Tabela -->
    <div class="table-wrap">
      <div class="table-header">
        <span class="table-title">Produtos em Estoque</span>
        <span id="contadorFiltro" style="font-size:12px;color:var(--color-text-muted)"></span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Nome do Produto</th>
              <th>Categoria</th>
              <th>Unidade</th>
              <th>Estoque Atual</th>
              <th>Est. Mínimo</th>
              <th>Est. Máximo</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="8" class="vazio">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="paginacao">
        <span id="infoPag"></span>
        <button class="btn-pag" id="btnAnterior" onclick="paginar(-1)" disabled>← Anterior</button>
        <button class="btn-pag" id="btnProximo" onclick="paginar(1)">Próximo →</button>
      </div>
    </div>

  </main>
</div><!-- /.app-layout -->

<script src="../menu.js"></script>
<script src="../SUPABASE.js"></script>
<script>
  // ── Sessão e permissão ─────────────────────────────────────
  sbVerificarSessao('../index.html');
  sbExigirPermissao('estoque', '../dashboard.html');

  // ── Header ─────────────────────────────────────────────────
  document.getElementById('roleBadge').textContent = sbPerfil() || '';

  // ── Tema ───────────────────────────────────────────────────
  (function () {
    const t   = localStorage.getItem('senai_tema') || 'light';
    const btn = document.getElementById('btnTema');
    if (btn) btn.textContent = t === 'dark' ? '☀️ Claro' : '🌙 Escuro';
  })();
  function alternarTema() {
    const novo = sbToggleTema();
    const btn  = document.getElementById('btnTema');
    if (btn) btn.textContent = novo === 'dark' ? '☀️ Claro' : '🌙 Escuro';
  }
  function sair() { sbLogout('../index.html'); }

  // ── Sidebar mobile ─────────────────────────────────────────
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
  }

  // ── Estado ─────────────────────────────────────────────────
  let todosProdutos = [];
  let produtosFiltrados = [];
  const POR_PAGINA = 20;
  let paginaAtual = 1;

  // ── Calcular status do produto ──────────────────────────────
  function statusProduto(p) {
    const atual = Number(p.estoque_atual ?? 0);
    const min   = Number(p.estoque_minimo ?? 0);
    if (atual < min)  return 'critico';
    if (atual === min) return 'atencao';
    return 'normal';
  }

  function badgeStatus(status) {
    if (status === 'critico') return '<span class="badge badge-vermelho">🔴 Crítico</span>';
    if (status === 'atencao') return '<span class="badge badge-laranja">🟡 Atenção</span>';
    return '<span class="badge badge-verde">🟢 Normal</span>';
  }

  function classeNum(status) {
    if (status === 'critico') return 'num-critico';
    if (status === 'atencao') return 'num-atencao';
    return 'num-normal';
  }

  // ── Carregar produtos ───────────────────────────────────────
  async function carregar() {
    try {
      todosProdutos = await sbListar('produtos', 'ativo=eq.true&order=nome.asc');

      // Preencher filtro de categorias
      const categorias = [...new Set(todosProdutos.map(p => p.categoria).filter(Boolean))].sort();
      const selCat = document.getElementById('filtroCategoria');
      categorias.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        selCat.appendChild(opt);
      });

      // Calcular resumo
      let normal = 0, atencao = 0, critico = 0;
      todosProdutos.forEach(p => {
        const s = statusProduto(p);
        if (s === 'normal')  normal++;
        else if (s === 'atencao') atencao++;
        else critico++;
      });
      document.getElementById('cntNormal').textContent  = normal;
      document.getElementById('cntAtencao').textContent = atencao;
      document.getElementById('cntCritico').textContent = critico;
      document.getElementById('cntTotal').textContent   = todosProdutos.length;

      filtrar();
    } catch (e) {
      console.error('[controle]', e);
      document.getElementById('tbody').innerHTML =
        '<tr><td colspan="8" class="vazio">Erro ao carregar produtos.</td></tr>';
    }
  }

  // ── Filtrar ─────────────────────────────────────────────────
  function filtrar() {
    const busca    = document.getElementById('busca').value.toLowerCase().trim();
    const status   = document.getElementById('filtroStatus').value;
    const categoria = document.getElementById('filtroCategoria').value;

    produtosFiltrados = todosProdutos.filter(p => {
      const s = statusProduto(p);
      const textoOk  = !busca || (p.nome || '').toLowerCase().includes(busca) || (p.codigo || '').toLowerCase().includes(busca);
      const statusOk = !status || s === status;
      const catOk    = !categoria || p.categoria === categoria;
      return textoOk && statusOk && catOk;
    });

    paginaAtual = 1;
    renderizar();
  }

  // ── Renderizar tabela ───────────────────────────────────────
  function renderizar() {
    const tbody = document.getElementById('tbody');
    const total = produtosFiltrados.length;
    const inicio = (paginaAtual - 1) * POR_PAGINA;
    const fim    = Math.min(inicio + POR_PAGINA, total);
    const pagina = produtosFiltrados.slice(inicio, fim);

    document.getElementById('contadorFiltro').textContent =
      total === todosProdutos.length
        ? `${total} produto(s)`
        : `${total} de ${todosProdutos.length} produto(s)`;

    document.getElementById('infoPag').textContent =
      total === 0 ? '' : `${inicio + 1}–${fim} de ${total}`;

    document.getElementById('btnAnterior').disabled = paginaAtual <= 1;
    document.getElementById('btnProximo').disabled  = fim >= total;

    if (!pagina.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="vazio">Nenhum produto encontrado.</td></tr>';
      return;
    }

    tbody.innerHTML = pagina.map(p => {
      const s     = statusProduto(p);
      const atual = Number(p.estoque_atual ?? 0);
      const min   = Number(p.estoque_minimo ?? 0);
      const max   = p.estoque_maximo != null ? Number(p.estoque_maximo) : null;
      return `
        <tr>
          <td style="font-family:monospace;font-size:12px;color:var(--color-text-muted)">${p.codigo ?? '—'}</td>
          <td style="font-weight:600;color:var(--color-text)">${p.nome}</td>
          <td>${p.categoria ?? '—'}</td>
          <td><span class="badge badge-cinza" style="background:#f0f0f0;color:#555">${p.unidade ?? '—'}</span></td>
          <td><span class="num-estoque ${classeNum(s)}">${atual.toLocaleString('pt-BR', {maximumFractionDigits:3})}</span></td>
          <td style="color:var(--color-text-muted)">${min.toLocaleString('pt-BR', {maximumFractionDigits:3})}</td>
          <td style="color:var(--color-text-muted)">${max != null ? max.toLocaleString('pt-BR', {maximumFractionDigits:3}) : '—'}</td>
          <td>${badgeStatus(s)}</td>
        </tr>
      `;
    }).join('');
  }

  function paginar(dir) {
    paginaAtual += dir;
    renderizar();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── Inicializar ─────────────────────────────────────────────
  carregar();
</script>
<script>
  (function () {
    if (localStorage.getItem('erp_role') === 'Administrador') {
      var el = document.getElementById('linkAdmin');
      if (el) el.style.display = 'flex';
    }
  })();
</script>
</body>
</html>
