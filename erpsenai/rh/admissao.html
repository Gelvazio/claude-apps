<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERP — Admissão</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .app-layout{display:flex;min-height:calc(100vh - 56px)}.sidebar{width:240px;background:var(--color-surface);border-right:1px solid var(--color-border-faint);display:flex;flex-direction:column;position:fixed;top:56px;left:0;bottom:0;overflow-y:auto;z-index:50;transition:transform .25s}.sidebar-section{padding:20px 0 4px}.sidebar-section-label{font-size:10px;font-weight:700;color:var(--color-text-disabled);letter-spacing:1.2px;text-transform:uppercase;padding:0 20px 6px}.sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13px;font-weight:500;color:var(--color-text-muted);text-decoration:none;border-left:3px solid transparent;transition:background .15s,color .15s,border-color .15s}.sidebar-link:hover{background:#e8f0fe;color:var(--color-primary)}.sidebar-link.ativo{background:#e8f0fe;color:var(--color-primary);border-left-color:var(--color-primary);font-weight:600}[data-theme="dark"] .sidebar-link:hover,[data-theme="dark"] .sidebar-link.ativo{background:#1e2554;color:#7aa3d4}.sidebar-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}.main{margin-left:240px;padding:28px 32px;flex:1}@media(max-width:768px){.sidebar{transform:translateX(-100%)}.main{margin-left:0;padding:16px}.sidebar.open{transform:translateX(0)}}.page-header{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.page-header h1{font-size:22px;font-weight:700;color:var(--color-text)}.page-header p{font-size:13px;color:var(--color-text-muted);margin-top:2px}.btn-menu{display:none;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:20px;width:36px;height:36px;border-radius:6px;cursor:pointer;align-items:center;justify-content:center}@media(max-width:768px){.btn-menu{display:flex}}.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:49}.sidebar-overlay.show{display:block}.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}.search-input{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:13px;background:var(--color-surface);color:var(--color-text);font-family:inherit;outline:none}.search-input:focus{border-color:var(--color-primary)}.filter-btn{padding:7px 14px;border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:12px;font-weight:600;background:var(--color-surface);color:var(--color-text-muted);cursor:pointer;font-family:inherit}.filter-btn.ativo{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}.content-section{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden}#msgGlobal{display:none;padding:10px 16px;border-radius:var(--radius-md);font-size:13px;font-weight:600;margin-bottom:14px}#msgGlobal.ok{background:var(--color-success-bg);border:1px solid var(--color-success-border);color:var(--color-success);display:block}#msgGlobal.err{background:var(--color-error-bg);border:1px solid var(--color-error-border);color:var(--color-error);display:block}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .span-2{grid-column:span 2}@media(max-width:600px){.form-grid{grid-template-columns:1fr}.form-grid .span-2{grid-column:span 1}}.form-group{display:flex;flex-direction:column;gap:4px}.form-label{font-size:10px;font-weight:700;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.3px}.form-label span{color:var(--color-error)}.form-input,.form-select,.form-textarea{width:100%;padding:9px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:13px;color:var(--color-text);background:var(--color-surface-3);font-family:inherit;outline:none}.form-input:focus,.form-select:focus{border-color:var(--color-primary)}.form-input[readonly]{background:var(--color-border-light);color:var(--color-text-muted);cursor:default}.form-textarea{resize:vertical;min-height:60px}[data-theme="dark"] .form-input,[data-theme="dark"] .form-select,[data-theme="dark"] .form-textarea{background:var(--color-surface-2);border-color:var(--color-border);color:var(--color-text)}.form-section-title{font-size:11px;font-weight:700;color:var(--color-primary);text-transform:uppercase;letter-spacing:.5px;padding:16px 0 4px;border-bottom:1px solid var(--color-border-faint);margin-bottom:4px;grid-column:1/-1}.modal-footer{padding:12px 20px;display:flex;justify-content:center;gap:10px;border-top:1px solid var(--color-border-light);background:var(--color-surface-2)}.modal-body-scroll{overflow-y:auto;padding:20px;flex:1;max-height:75vh}.paginacao{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--color-border-faint);font-size:12px;color:var(--color-text-muted)}.paginacao-btns{display:flex;gap:6px}.pag-btn{padding:4px 10px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);color:var(--color-text-muted);font-size:12px;cursor:pointer;font-family:inherit}.pag-btn:disabled{opacity:.4;cursor:default}
    @media(max-width:600px){.form-input,.form-select,.form-textarea{font-size:16px}}
  </style>
  <script>(function(){const t=localStorage.getItem('senai_tema')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <script src="../gamificacao/gamif.js"></script>
</head>
<body>
<header class="header">
  <button class="btn-menu" id="btnMenu" onclick="toggleSidebar()">☰</button>
  <a class="header-logo" href="../dashboard.html">ERP</a>
  <span class="header-title">Senai</span>
  <span class="header-spacer"></span>
  <span class="role-badge" id="roleBadge"></span>
  <button class="header-btn" id="btnTema" style="min-width:96px">🌙 Escuro</button>
  <button class="header-btn" onclick="sair()">🚪 Sair</button>
</header>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="page-header">
      <div><h1>📝 Admissão</h1><p>Solicitações de admissão de novos colaboradores</p></div>
      <button class="btn" onclick="abrirModalNovo()">+ Nova Admissão</button>
    </div>
    <div id="msgGlobal"></div>
    <div class="toolbar">
      <input class="search-input" type="text" id="campoBusca" placeholder="🔍  Buscar por nome ou número..." oninput="filtrar()">
      <select class="filter-btn" id="filtroStatus" onchange="filtrar()" style="cursor:pointer"><option value="">Todos os status</option><option>Pendente</option><option>Aprovada</option><option>Reprovada</option><option>Cancelada</option><option>Concluída</option></select>
    </div>
    <div class="content-section">
      <div class="crud-table-wrap">
        <table class="crud-table">
          <thead><tr><th>Número</th><th>Candidato</th><th>Cargo Pretendido</th><th>Departamento</th><th>Data Prevista</th><th>Tipo Contrato</th><th>Salário</th><th>Status</th><th style="width:80px">Ações</th></tr></thead>
          <tbody id="tbodyAdmissao"><tr><td colspan="9" class="crud-vazio">Carregando…</td></tr></tbody>
        </table>
      </div>
      <div class="paginacao"><span id="paginacaoInfo">—</span><div class="paginacao-btns"><button class="pag-btn" id="btnAnterior" onclick="mudarPagina(-1)">‹ Anterior</button><button class="pag-btn" id="btnProximo" onclick="mudarPagina(1)">Próxima ›</button></div></div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="crud-backdrop" id="modalFormulario" style="display:none" onclick="fecharSeClicouFora(event,'modalFormulario')">
  <div class="crud-modal" style="max-width:860px">
    <div class="crud-modal-head"><h3 id="modalTitulo">Nova Admissão</h3><button class="crud-btn-fechar" onclick="fecharModal()">✕</button></div>
    <div class="modal-body-scroll">
      <div id="msgModal" style="display:none;margin-bottom:12px;padding:10px 14px;border-radius:6px;font-size:13px;font-weight:600;"></div>
      <form id="formAdm" onsubmit="salvar(event)">
        <div class="form-grid">
          <div class="form-group"><label class="form-label">Número</label><input class="form-input" type="text" id="fNumero" readonly></div>
          <div class="form-group"><label class="form-label">Data da Solicitação</label><input class="form-input" type="date" id="fDataSolicitacao"></div>

          <div class="form-section-title">Dados do Candidato</div>
          <div class="form-group span-2"><label class="form-label">Nome do Candidato <span>*</span></label><input class="form-input" type="text" id="fNome" required placeholder="Nome completo do candidato"></div>
          <div class="form-group"><label class="form-label">CPF</label><input class="form-input" type="text" id="fCpf" placeholder="000.000.000-00" maxlength="14" oninput="mascCPF(this)"></div>
          <div class="form-group"><label class="form-label">E-mail</label><input class="form-input" type="email" id="fEmail" placeholder="candidato@email.com"></div>
          <div class="form-group"><label class="form-label">Telefone</label><input class="form-input" type="text" id="fTelefone" placeholder="(00) 00000-0000" maxlength="15" oninput="mascTel(this)"></div>
          <div class="form-group"><label class="form-label">Data de Nascimento</label><input class="form-input" type="date" id="fNascimento"></div>

          <div class="form-section-title">Vaga e Contratação</div>
          <div class="form-group"><label class="form-label">Cargo Pretendido <span>*</span></label><select class="form-select" id="fCargo" required><option value="">— Selecione —</option></select></div>
          <div class="form-group"><label class="form-label">Departamento</label><select class="form-select" id="fDepartamento" onchange="filtrarCargos()"><option value="">— Selecione —</option></select></div>
          <div class="form-group"><label class="form-label">Tipo de Contrato</label><select class="form-select" id="fTipoContrato"><option value="">— Selecione —</option><option>CLT</option><option>PJ</option><option>Temporário</option><option>Estágio</option><option>Aprendiz</option></select></div>
          <div class="form-group"><label class="form-label">Salário Proposto (R$)</label><input class="form-input" type="number" id="fSalario" min="0" step="0.01" placeholder="0,00"></div>
          <div class="form-group"><label class="form-label">Data Prevista de Início</label><input class="form-input" type="date" id="fDataInicio"></div>
          <div class="form-group"><label class="form-label">Solicitante / Requisitante</label><input class="form-input" type="text" id="fSolicitante" placeholder="Nome do gestor que solicitou"></div>
          <div class="form-group span-2"><label class="form-label">Origem da Vaga</label><select class="form-select" id="fOrigem"><option value="">— Selecione —</option><option>Indicação</option><option>LinkedIn</option><option>Site da empresa</option><option>Agência</option><option>Banco de talentos</option><option>Outros</option></select></div>
          <div class="form-group"><label class="form-label">Status</label><select class="form-select" id="fStatus"><option>Pendente</option><option>Aprovada</option><option>Reprovada</option><option>Cancelada</option><option>Concluída</option></select></div>
          <div class="form-group"><label class="form-label">Aprovado Por</label><input class="form-input" type="text" id="fAprovadoPor" placeholder="Nome do aprovador"></div>
          <div class="form-group span-2"><label class="form-label">Justificativa</label><textarea class="form-textarea" id="fJustificativa" placeholder="Justificativa para abertura da vaga…"></textarea></div>
          <div class="form-group span-2"><label class="form-label">Observações</label><textarea class="form-textarea" id="fObs" placeholder="Perfil desejado, habilidades, requisitos específicos…"></textarea></div>
        </div>
      </form>
    </div>
    <div class="modal-footer"><button class="btn-cancelar" onclick="fecharModal()">Cancelar</button><button class="btn-salvar" onclick="document.getElementById('formAdm').requestSubmit()">Confirmar</button></div>
  </div>
</div>

<div class="crud-backdrop" id="modalExcluir" style="display:none" onclick="fecharSeClicouFora(event,'modalExcluir')">
  <div class="crud-modal" style="max-width:440px">
    <div class="crud-modal-head" style="background:#c62828"><h3>Confirmar Exclusão</h3><button class="crud-btn-fechar" onclick="fecharModalExcluir()">✕</button></div>
    <div class="modal-body-scroll" style="padding:20px"><p style="font-size:14px">Excluir a admissão <strong id="nomeExcluir"></strong>?</p></div>
    <div class="modal-footer"><button class="btn-cancelar" onclick="fecharModalExcluir()">Cancelar</button><button class="btn-salvar" style="background:#c62828" onclick="excluirConfirmado()">🗑️ Excluir</button></div>
  </div>
</div>

<script src="../menu.js"></script>
<script src="../SUPABASE.js"></script>
<script>
  sbVerificarSessao();
  document.getElementById('roleBadge').textContent=sbPerfil()||'';
  (function(){const t=localStorage.getItem('senai_tema')||'light';const btn=document.getElementById('btnTema');btn.textContent=t==='dark'?'☀️ Claro':'🌙 Escuro';btn.onclick=()=>{const n=sbToggleTema();btn.textContent=n==='dark'?'☀️ Claro':'🌙 Escuro';};})();
  function sair(){sbLogout('../index.html');}
  function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('show');}

  let todos=[],filtrados=[],paginaAtual=0;
  const POR_PAGINA=50;
  let idParaExcluir=null,modoEdicao=false,idEdicao=null;
  let departamentos=[],todosCargos=[];

  function msg(t,tipo='ok',ms=4000){const el=document.getElementById('msgGlobal');el.textContent=t;el.className=tipo;el.style.display='block';if(ms>0)setTimeout(()=>el.style.display='none',ms);}
  function msgModal(t,tipo='err'){const el=document.getElementById('msgModal');el.textContent=t;el.style.cssText=tipo==='err'?'display:block;background:#fce8e6;border:1px solid #f44336;color:#c62828':'display:block;background:#e8f5e9;border:1px solid #c8e6c9;color:#2e7d32';}

  function mascCPF(el){let v=el.value.replace(/\D/g,'');if(v.length>11)v=v.slice(0,11);v=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3}\.\d{3})(\d)/,'$1.$2').replace(/(\d{3}\.\d{3}\.\d{3})(\d{1,2})/,'$1-$2');el.value=v;}
  function mascTel(el){let v=el.value.replace(/\D/g,'');if(v.length>11)v=v.slice(0,11);if(v.length<=10)v=v.replace(/(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3');else v=v.replace(/(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3');el.value=v;}

  function nomeDep(id){const d=departamentos.find(x=>x.id===id);return d?d.nome:'—';}
  function nomeCargo(id){const c=todosCargos.find(x=>x.id===id);return c?c.nome:'—';}

  function filtrarCargos(){
    const depId=document.getElementById('fDepartamento').value;
    const filtrados=depId?todosCargos.filter(c=>c.departamento_id===depId):todosCargos;
    const sel=document.getElementById('fCargo');
    sel.innerHTML='<option value="">— Selecione —</option>'+filtrados.map(c=>`<option value="${c.id}">${c.nome}</option>`).join('');
  }

  async function carregar(){
    document.getElementById('tbodyAdmissao').innerHTML='<tr><td colspan="9" class="crud-vazio">Carregando…</td></tr>';
    try{
      [departamentos,todosCargos]=await Promise.all([
        sbListar('rh_departamentos','ativo=eq.true&order=nome.asc'),
        sbListar('rh_cargos','ativo=eq.true&order=nome.asc')
      ]);
      document.getElementById('fDepartamento').innerHTML='<option value="">— Selecione —</option>'+departamentos.map(d=>`<option value="${d.id}">${d.nome}</option>`).join('');
      filtrarCargos();
      todos=await sbListar('rh_admissoes','order=created_at.desc');
      filtrar();
    }catch(e){document.getElementById('tbodyAdmissao').innerHTML=`<tr><td colspan="9" class="crud-vazio">Erro: ${e.message}</td></tr>`;}
  }

  function filtrar(){
    const t=document.getElementById('campoBusca').value.toLowerCase().trim();
    const st=document.getElementById('filtroStatus').value;
    filtrados=todos.filter(r=>{
      if(st&&r.status!==st)return false;
      if(t)return(r.nome_candidato||'').toLowerCase().includes(t)||(r.numero||'').toLowerCase().includes(t)||(r.email||'').toLowerCase().includes(t);
      return true;
    });
    paginaAtual=0;renderTabela();
  }

  const ST={Pendente:'badge-azul',Aprovada:'badge-verde',Reprovada:'badge-vermelho',Cancelada:'badge-vermelho',Concluída:'badge-verde'};

  function renderTabela(){
    const tbody=document.getElementById('tbodyAdmissao');
    const inicio=paginaAtual*POR_PAGINA;const pag=filtrados.slice(inicio,inicio+POR_PAGINA);
    document.getElementById('paginacaoInfo').textContent=`${filtrados.length} registro(s) · página ${paginaAtual+1} de ${Math.max(1,Math.ceil(filtrados.length/POR_PAGINA))}`;
    document.getElementById('btnAnterior').disabled=paginaAtual===0;
    document.getElementById('btnProximo').disabled=inicio+POR_PAGINA>=filtrados.length;
    if(!pag.length){tbody.innerHTML='<tr><td colspan="9" class="crud-vazio">Nenhuma admissão encontrada.</td></tr>';return;}
    tbody.innerHTML=pag.map(r=>`<tr>
      <td style="font-family:monospace;font-size:12px">${r.numero||'—'}</td>
      <td>${r.nome_candidato||'—'}</td>
      <td>${nomeCargo(r.cargo_id)}</td>
      <td>${nomeDep(r.departamento_id)}</td>
      <td>${r.data_inicio?new Date(r.data_inicio+'T00:00:00').toLocaleDateString('pt-BR'):'—'}</td>
      <td>${r.tipo_contrato||'—'}</td>
      <td>${r.salario?'R$ '+parseFloat(r.salario).toLocaleString('pt-BR',{minimumFractionDigits:2}):'—'}</td>
      <td><span class="${ST[r.status]||'badge-azul'}">${r.status||'Solicitado'}</span></td>
      <td class="crud-acts"><button class="btn-ed" onclick="abrirModalEditar('${r.id}')">✏️</button><button class="btn-del" onclick="confirmarExcluir('${r.id}','${(r.numero||'').replace(/'/g,"\\'")}')">🗑️</button></td>
    </tr>`).join('');
  }

  function mudarPagina(dir){paginaAtual+=dir;renderTabela();window.scrollTo(0,0);}

  async function abrirModalNovo(){
    modoEdicao=false;idEdicao=null;
    document.getElementById('modalTitulo').textContent='Nova Admissão';
    document.getElementById('formAdm').reset();
    document.getElementById('msgModal').style.display='none';
    document.getElementById('fNumero').value=await sbProximoNumero('rh_admissoes','numero','ADM');
    document.getElementById('fDataSolicitacao').value=new Date().toISOString().split('T')[0];
    document.getElementById('fStatus').value='Pendente';
    filtrarCargos();
    document.getElementById('modalFormulario').style.display='flex';
  }

  async function abrirModalEditar(id){
    modoEdicao=true;idEdicao=id;
    document.getElementById('modalTitulo').textContent='Editar Admissão';
    const r=todos.find(x=>x.id===id);if(!r)return;
    document.getElementById('fNumero').value=r.numero||'';
    document.getElementById('fDataSolicitacao').value=r.data_solicitacao||'';
    document.getElementById('fNome').value=r.nome_candidato||'';
    document.getElementById('fCpf').value=r.cpf||'';
    document.getElementById('fEmail').value=r.email||'';
    document.getElementById('fTelefone').value=r.telefone||'';
    document.getElementById('fNascimento').value=r.data_nascimento||'';
    document.getElementById('fDepartamento').value=r.departamento_id||'';
    filtrarCargos();
    document.getElementById('fCargo').value=r.cargo_id||'';
    document.getElementById('fTipoContrato').value=r.tipo_contrato||'';
    document.getElementById('fSalario').value=r.salario||'';
    document.getElementById('fDataInicio').value=r.data_inicio||'';
    document.getElementById('fSolicitante').value=r.solicitante||'';
    document.getElementById('fOrigem').value=r.origem_vaga||'';
    document.getElementById('fStatus').value=r.status||'Pendente';
    document.getElementById('fAprovadoPor').value=r.aprovado_por||'';
    document.getElementById('fJustificativa').value=r.justificativa||'';
    document.getElementById('fObs').value=r.observacoes||'';
    document.getElementById('modalFormulario').style.display='flex';
  }

  function fecharModal(){document.getElementById('modalFormulario').style.display='none';}
  function fecharSeClicouFora(e,id){if(e.target.id===id)document.getElementById(id).style.display='none';}

  async function salvar(e){
    e.preventDefault();
    const nome=document.getElementById('fNome').value.trim();
    if(!nome){msgModal('Nome do candidato é obrigatório.');return;}
    const dados={
      numero:document.getElementById('fNumero').value,
      data_solicitacao:document.getElementById('fDataSolicitacao').value||null,
      nome_candidato:nome,
      cpf:document.getElementById('fCpf').value.trim()||null,
      email:document.getElementById('fEmail').value.trim()||null,
      telefone:document.getElementById('fTelefone').value.trim()||null,
      data_nascimento:document.getElementById('fNascimento').value||null,
      departamento_id:document.getElementById('fDepartamento').value||null,
      cargo_id:document.getElementById('fCargo').value||null,
      tipo_contrato:document.getElementById('fTipoContrato').value||null,
      salario:parseFloat(document.getElementById('fSalario').value)||null,
      data_inicio:document.getElementById('fDataInicio').value||null,
      solicitante:document.getElementById('fSolicitante').value.trim()||null,
      origem_vaga:document.getElementById('fOrigem').value||null,
      status:document.getElementById('fStatus').value,
      aprovado_por:document.getElementById('fAprovadoPor').value.trim()||null,
      justificativa:document.getElementById('fJustificativa').value.trim()||null,
      observacoes:document.getElementById('fObs').value.trim()||null
    };
    try{
      if(modoEdicao)await sbAtualizar('rh_admissoes',idEdicao,dados);
      else          await sbInserir('rh_admissoes',dados);
      fecharModal();await carregar();msg(modoEdicao?'Admissão atualizada!':'Admissão registrada!');
    }catch(err){msgModal('Erro: '+err.message);}
  }

  function confirmarExcluir(id,nome){idParaExcluir=id;document.getElementById('nomeExcluir').textContent=nome;document.getElementById('modalExcluir').style.display='flex';}
  function fecharModalExcluir(){document.getElementById('modalExcluir').style.display='none';}
  async function excluirConfirmado(){try{await sbExcluir('rh_admissoes',idParaExcluir);fecharModalExcluir();await carregar();msg('Excluído.','ok');}catch(e){fecharModalExcluir();msg('Erro: '+e.message,'err');}}

  carregar();
</script>
