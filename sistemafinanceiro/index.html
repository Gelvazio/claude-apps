<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Financeiro</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>💰</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/styles.css" />
  <style>
    /* ── Page wrap ───────────────────────────────────────────────── */
    .page-wrap {
      padding: 76px 24px 56px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── Month bar ───────────────────────────────────────────────── */
    .month-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }
    .month-bar-title {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--h1), var(--h3), var(--h2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .month-picker-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .month-nav-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(180,110,255,0.25);
      color: var(--txt-dim);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
    }
    .month-nav-btn:hover {
      background: rgba(255,255,255,0.11);
      color: var(--txt);
    }
    #month-picker {
      padding: 7px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(180,110,255,0.28);
      color: var(--txt);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    #month-picker:focus { border-color: var(--h2); }
    #month-picker::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }

    /* ── Summary cards ───────────────────────────────────────────── */
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .summary-card {
      background: rgba(20,17,46,0.70);
      border: 1px solid rgba(180,110,255,0.15);
      border-radius: 12px;
      padding: 13px 15px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .summary-card:hover { box-shadow: var(--shadow-card); }
    .summary-card--receber  { border-color: rgba(52,224,215,0.28); }
    .summary-card--pagar    { border-color: rgba(255,91,110,0.28); }
    .summary-card--saldo    { border-color: rgba(93,212,93,0.22); }
    .summary-card--pendente { border-color: rgba(255,184,77,0.32); }
    .summary-card--pendente .summary-card-value { color: var(--h3); }
    .summary-card-icon  { font-size: 17px; margin-bottom: 1px; }
    .summary-card-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--txt-soft);
    }
    .summary-card-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--h2);
      letter-spacing: -0.5px;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    .summary-card-value.positive { color: var(--warn-green); }
    .summary-card-value.negative { color: var(--warn-red); }
    .summary-card-sub {
      font-size: 10px;
      color: var(--txt-soft);
      margin-top: 1px;
    }

    /* ── Filter bar ──────────────────────────────────────────────── */
    .filter-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-bottom: 14px;
      padding: 12px 16px;
      background: rgba(14,11,30,0.55);
      border: 1px solid rgba(180,110,255,0.12);
      border-radius: 12px;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--txt-soft);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
      margin-right: 2px;
    }
    .filter-btn {
      padding: 5px 13px;
      border-radius: 8px;
      border: 1px solid rgba(180,110,255,0.22);
      background: rgba(255,255,255,0.03);
      color: var(--txt-dim);
      cursor: pointer;
      font-family: inherit;
      font-size: 12.5px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .filter-btn:hover {
      background: rgba(255,255,255,0.08);
      color: var(--txt);
    }
    .filter-btn.active {
      background: linear-gradient(90deg, rgba(255,79,163,0.22), rgba(52,224,215,0.12));
      color: var(--txt);
      border-color: rgba(255,79,163,0.42);
    }
    .filter-sep {
      width: 1px;
      height: 22px;
      background: rgba(180,110,255,0.22);
      flex-shrink: 0;
    }

    /* ── Table ───────────────────────────────────────────────────── */
    .table-wrap {
      background: rgba(14,11,30,0.55);
      border: 1px solid rgba(180,110,255,0.15);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
    }
    .fin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    .fin-table thead tr {
      background: rgba(10,8,24,0.6);
    }
    .fin-table th {
      padding: 12px 14px;
      text-align: left;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--txt-soft);
      border-bottom: 1px solid rgba(180,110,255,0.18);
      white-space: nowrap;
    }
    .fin-table td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(180,110,255,0.07);
      vertical-align: middle;
      color: var(--txt-dim);
    }
    .fin-table tbody tr:last-child td { border-bottom: none; }

    /* Row tints by status */
    .row-s0 td  { background: rgba(255, 91,110,0.055); }
    .row-s0:hover td { background: rgba(255, 91,110,0.10) !important; }
    .row-s1 td  { background: rgba( 93,212, 93,0.055); }
    .row-s1:hover td { background: rgba( 93,212, 93,0.10) !important; }
    .row-s3 td  { background: rgba(255,184, 77,0.055); }
    .row-s3:hover td { background: rgba(255,184, 77,0.10) !important; }

    /* Status badges */
    .sbadge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .sbadge-0 {
      background: rgba(255, 91,110,0.18);
      color: #ffaab3;
      border: 1px solid rgba(255, 91,110,0.38);
    }
    .sbadge-1 {
      background: rgba( 93,212, 93,0.18);
      color: #a8f0a8;
      border: 1px solid rgba( 93,212, 93,0.38);
    }
    .sbadge-3 {
      background: rgba(255,184, 77,0.18);
      color: #ffd28a;
      border: 1px solid rgba(255,184, 77,0.38);
    }

    /* Tipo badges */
    .tbadge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .tbadge-pagar {
      background: rgba(255, 91,110,0.15);
      color: #ffaab3;
      border: 1px solid rgba(255, 91,110,0.30);
    }
    .tbadge-receber {
      background: rgba(52,224,215,0.15);
      color: var(--h2);
      border: 1px solid rgba(52,224,215,0.30);
    }

    /* Action buttons */
    .btn-action {
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .btn-pagar {
      background: rgba(93,212,93,0.18);
      color: #a8f0a8;
      border-color: rgba(93,212,93,0.42);
    }
    .btn-pagar:hover:not(:disabled) {
      background: rgba(93,212,93,0.30);
      color: #c4f7c4;
    }
    .btn-receber {
      background: rgba(52,224,215,0.18);
      color: var(--h2);
      border-color: rgba(52,224,215,0.40);
    }
    .btn-receber:hover:not(:disabled) {
      background: rgba(52,224,215,0.30);
      color: var(--h2-glow);
    }
    .btn-action:disabled {
      opacity: 0.32;
      cursor: not-allowed;
    }

    /* Col helpers */
    .col-desc  { color: var(--txt); font-weight: 500; }
    .col-valor {
      font-weight: 600;
      color: var(--txt);
      font-family: 'JetBrains Mono', Consolas, monospace;
      white-space: nowrap;
    }
    .col-parc  { font-size: 12px; color: var(--txt-soft); white-space: nowrap; }
    .col-date  { white-space: nowrap; font-size: 13px; }

    .table-empty {
      text-align: center;
      padding: 40px !important;
      color: var(--txt-soft);
      font-size: 14px;
    }

    /* Toast */
    #toast {
      display: none;
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 10px;
      background: rgba(26,22,64,0.96);
      border: 1px solid rgba(52,224,215,0.38);
      color: var(--txt);
      font-size: 13px;
      font-weight: 500;
      z-index: 200;
      box-shadow: var(--shadow-card);
      animation: toast-in 0.22s ease;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Action bar ─────────────────────────────────────────────── */
    .action-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .btn-nova {
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
    }
    .btn-nova-pagar {
      background: rgba(255,91,110,0.18);
      color: #ffaab3;
      border-color: rgba(255,91,110,0.42);
    }
    .btn-nova-pagar:hover { background: rgba(255,91,110,0.28); }
    .btn-nova-receber {
      background: rgba(52,224,215,0.18);
      color: var(--h2);
      border-color: rgba(52,224,215,0.40);
    }
    .btn-nova-receber:hover { background: rgba(52,224,215,0.28); }

    /* ── Cancelar / Editar buttons ───────────────────────────────── */
    .btn-cancelar {
      background: rgba(255,184,77,0.18);
      color: #ffd28a;
      border: 1px solid rgba(255,184,77,0.40);
    }
    .btn-cancelar:hover:not(:disabled) { background: rgba(255,184,77,0.30); color: #ffe0a8; }
    .btn-editar {
      background: rgba(90,184,255,0.18);
      color: var(--link);
      border: 1px solid rgba(90,184,255,0.40);
    }
    .btn-editar:hover:not(:disabled) {
      background: rgba(90,184,255,0.30);
      color: var(--link-hov);
    }
    .btn-excluir {
      background: rgba(220,30,60,0.15);
      color: #ff6070;
      border: 1px solid rgba(220,30,60,0.45);
    }
    .btn-excluir:hover:not(:disabled) {
      background: rgba(220,30,60,0.28);
      color: #ff8090;
    }

    /* ── Action cell (3 buttons) ─────────────────────────────────── */
    .action-cell {
      display: flex;
      gap: 5px;
      align-items: center;
      justify-content: center;
    }
    .action-cell .btn-action {
      padding: 5px 0;
      font-size: 11.5px;
      width: 76px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Modal form inputs ───────────────────────────────────────── */
    .fin-modal .field {
      margin-bottom: 12px;
    }
    .fin-modal .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--txt-soft);
      margin-bottom: 5px;
    }
    .fin-modal .field input,
    .fin-modal .field select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(180,110,255,0.25);
      color: var(--txt);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.15s;
    }
    .fin-modal .field input:focus,
    .fin-modal .field select:focus { border-color: var(--h2); }
    .fin-modal .field select option { background: #14112e; color: var(--txt); }
    .fin-modal .field input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }
    .modal-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 14px;
    }
    .field-full { grid-column: span 2; }

    /* Responsive */
    @media (max-width: 1050px) {
      .summary-cards { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      .summary-cards { grid-template-columns: 1fr 1fr; }
      .page-wrap { padding: 72px 12px 40px; }
      .fin-table { font-size: 12px; }
      .fin-table th, .fin-table td { padding: 10px 10px; }
    }
    @media (max-width: 420px) {
      .summary-cards { grid-template-columns: 1fr; }
    }

    /* ── Scope modal buttons ─────────────────────────────────────── */
    .scope-btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
      border: 1px solid transparent;
      line-height: 1.4;
    }
    .scope-btn-single {
      background: rgba(90,184,255,0.12);
      color: var(--link);
      border-color: rgba(90,184,255,0.28);
    }
    .scope-btn-single:hover { background: rgba(90,184,255,0.22); }
    .scope-btn-future {
      background: rgba(255,184,77,0.12);
      color: #ffd28a;
      border-color: rgba(255,184,77,0.28);
    }
    .scope-btn-future:hover { background: rgba(255,184,77,0.22); }
    .scope-btn-all {
      background: rgba(255,91,110,0.12);
      color: #ffaab3;
      border-color: rgba(255,91,110,0.28);
    }
    .scope-btn-all:hover { background: rgba(255,91,110,0.22); }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <h1>💰 Financeiro</h1>
    <div class="header-right">
      <span id="month-label" style="font-size:13px; color:var(--txt-dim);"></span>
      <span id="nav-user" style="font-size:12px; color:var(--txt-soft); margin-left:4px;"></span>
      <button id="btn-config" class="btn btn-small btn-ghost" style="margin-left:4px">⚙️ Config</button>
      <button id="btn-logout" class="btn btn-small btn-ghost" style="margin-left:4px">Sair</button>
    </div>
  </nav>

  <div class="page-wrap">

    <!-- Month selector -->
    <div class="month-bar">
      <div class="month-picker-wrap">
        <button class="month-nav-btn" id="btn-prev" title="Mês anterior">&#8249;</button>
        <input type="month" id="month-picker" />
        <button class="month-nav-btn" id="btn-next" title="Próximo mês">&#8250;</button>
      </div>
    </div>

    <!-- Summary cards -->
    <div class="summary-cards">
      <div class="summary-card summary-card--receber">
        <div class="summary-card-icon">📥</div>
        <div class="summary-card-label">Contas a Receber</div>
        <div class="summary-card-value" id="card-receber">R$ 0,00</div>
        <div class="summary-card-sub" id="card-receber-sub"></div>
      </div>
      <div class="summary-card summary-card--pagar">
        <div class="summary-card-icon">📤</div>
        <div class="summary-card-label">Contas a Pagar</div>
        <div class="summary-card-value" id="card-pagar">R$ 0,00</div>
        <div class="summary-card-sub" id="card-pagar-sub"></div>
      </div>
      <div class="summary-card summary-card--saldo">
        <div class="summary-card-icon">⚖️</div>
        <div class="summary-card-label">Saldo</div>
        <div class="summary-card-value" id="card-saldo">R$ 0,00</div>
        <div class="summary-card-sub" id="card-saldo-sub"></div>
      </div>
      <div class="summary-card summary-card--pendente">
        <div class="summary-card-icon">⏳</div>
        <div class="summary-card-label">Saldo Pendente</div>
        <div class="summary-card-value" id="card-pendente">R$ 0,00</div>
        <div class="summary-card-sub" id="card-pendente-sub"></div>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="filter-group">
        <span class="filter-label">Tipo</span>
        <button class="filter-btn active" data-ftipo="todos">Todos</button>
        <button class="filter-btn" data-ftipo="pagar">A Pagar</button>
        <button class="filter-btn" data-ftipo="receber">A Receber</button>
      </div>
      <div class="filter-sep"></div>
      <div class="filter-group">
        <span class="filter-label">Status</span>
        <button class="filter-btn active" data-fstatus="todos">Todos</button>
        <button class="filter-btn" data-fstatus="0">Aberto</button>
        <button class="filter-btn" data-fstatus="1">Pago</button>
        <button class="filter-btn" data-fstatus="3">Cancelado</button>
      </div>
    </div>

    <!-- Action bar -->
    <div class="action-bar">
      <button class="btn-nova btn-nova-pagar" id="btn-ins-pagar">+ Inserir Conta a Pagar</button>
      <button class="btn-nova btn-nova-receber" id="btn-ins-receber">+ Inserir Conta a Receber</button>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table class="fin-table">
        <thead>
          <tr>
            <th>Descrição</th>
            <th>Tipo</th>
            <th>Vencimento</th>
            <th>Pagamento</th>
            <th>Parcela</th>
            <th>Valor</th>
            <th>Status</th>
            <th style="text-align:center">Ação</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="8" class="table-empty">Carregando...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- Modal de confirmação genérico -->
  <div class="modal-back" id="modal-confirm" style="display:none">
    <div class="modal" style="max-width:420px; text-align:center">
      <div id="modal-confirm-icon" style="font-size:38px; margin-bottom:10px"></div>
      <h3 id="modal-confirm-title" style="margin-bottom:12px"></h3>
      <p id="modal-confirm-msg" style="font-size:14px; color:var(--txt-dim); line-height:1.65; margin-bottom:24px"></p>
      <div class="modal-actions-center modal-actions-pair">
        <button class="btn btn-activate" id="btn-confirm-ok" style="padding:9px 22px; font-size:13px">Confirmar</button>
        <button class="btn btn-cancel-light" id="btn-confirm-cancel" style="padding:9px 22px; font-size:13px">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal de escopo (excluir / editar em lote) -->
  <div class="modal-back" id="modal-scope" style="display:none">
    <div class="modal" style="max-width:400px">
      <div id="modal-scope-icon" style="font-size:34px;margin-bottom:8px;text-align:center"></div>
      <h3 id="modal-scope-title" style="margin-bottom:6px;text-align:center"></h3>
      <p id="modal-scope-msg" style="font-size:13px;color:var(--txt-dim);line-height:1.55;margin-bottom:18px;text-align:center"></p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="scope-btn scope-btn-single" id="btn-scope-single">📌 Somente esta parcela</button>
        <button class="scope-btn scope-btn-future" id="btn-scope-future">🔜 Esta e todas as futuras</button>
        <button class="scope-btn scope-btn-all" id="btn-scope-all">📋 Todas (incluindo pagas e canceladas)</button>
        <button class="btn btn-cancel-light" id="btn-scope-cancel" style="margin-top:4px">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Form Modal (Insert & Edit) -->
  <div class="modal-back fin-modal" id="modal-form" style="display:none">
    <div class="modal modal-wide">
      <h3 id="modal-form-title">Lançamento</h3>
      <form id="form-lanc" novalidate autocomplete="off">
        <input type="hidden" id="f-id" />
        <input type="hidden" id="f-id-parcelamento" />
        <div class="field field-full" id="id-field" style="display:none">
          <label>ID</label>
          <input type="text" id="f-id-display" readonly class="disabled" />
        </div>
        <div class="field field-full">
          <label>Descrição *</label>
          <input type="text" id="f-descricao" placeholder="Ex: Aluguel, Salário..." maxlength="100" />
        </div>
        <div class="modal-form-grid">
          <div class="field">
            <label>Tipo *</label>
            <select id="f-tipo">
              <option value="pagar">Conta a Pagar</option>
              <option value="receber">Conta a Receber</option>
            </select>
          </div>
          <div class="field">
            <label>Status *</label>
            <select id="f-status">
              <option value="0">Aberto</option>
              <option value="1">Pago</option>
              <option value="3">Cancelado</option>
            </select>
          </div>
          <div class="field">
            <label>Data de Vencimento *</label>
            <input type="date" id="f-vencimento" />
          </div>
          <div class="field">
            <label>Data de Pagamento</label>
            <input type="date" id="f-pagamento" />
          </div>
          <div class="field">
            <label>Qtd. Parcelas *</label>
            <input type="number" id="f-qtd-parcelas" min="1" max="999" placeholder="1" />
          </div>
          <div class="field">
            <label>Parcela Atual *</label>
            <input type="number" id="f-parcela-atual" min="1" max="999" placeholder="1" class="disabled" disabled />
          </div>
          <div class="field field-full">
            <label>Valor (R$) *</label>
            <input type="number" id="f-valor" step="0.01" min="0" placeholder="0.00" />
          </div>
        </div>
        <p id="form-err" style="color:var(--warn-red);font-size:12px;min-height:16px;text-align:center;margin:6px 0 0"></p>
        <div class="modal-actions-center modal-actions-pair" style="margin-top:14px">
          <button type="submit" class="btn btn-activate" id="btn-gravar">Gravar</button>
          <button type="button" class="btn btn-cancel-light" id="btn-modal-fechar">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Configurações -->
  <div class="modal-back fin-modal" id="modal-config" style="display:none">
    <div class="modal">
      <h3>⚙️ Configurações</h3>
      <form id="form-config" novalidate>
        <div class="field field-full">
          <label>Usuário</label>
          <input type="text" id="cfg-email" readonly />
        </div>
        <div class="field field-full">
          <label>Nome</label>
          <input type="text" id="cfg-nome" readonly />
        </div>
        <div class="field field-full">
          <label>Loja Padrão *</label>
          <select id="cfg-loja">
            <option value="">Carregando lojas...</option>
          </select>
        </div>
        <div class="field field-full">
          <label>Data da Sessão</label>
          <input type="text" id="cfg-data-sessao" readonly />
        </div>
        <div style="margin-top: 20px; text-align: center; font-size: 12px; color: var(--txt-soft);">
          <p>Versão: 2.0 (Supabase)</p>
        </div>
        <div class="modal-actions-center modal-actions-pair" style="margin-top: 20px;">
          <button type="button" class="btn btn-activate" id="btn-salvar-config">Salvar</button>
          <button type="button" class="btn btn-cancel-light" id="btn-fechar-config">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
